# Automated dependency updates.
#
# Dependabot is the free, built-in counterpart to the Definition of Done: the gate proves a change is safe, this keeps
# the inputs current so the gate has something honest to prove. Every ecosystem the repository actually ships or builds
# from is covered; updates land as pull requests against the single `main` trunk (ADR-0125) and are gated by CI.
#
# VERSION UPDATES ARE PAUSED (issue #36), except for the docker ecosystem. While the family is refactored heavily
# ahead of its first release, a weekly version bump is mostly churn against code that is about to move. Every other
# ecosystem therefore sets `open-pull-requests-limit: 0`, which is GitHub's documented way to pause version updates
# while keeping their configuration. The docker ecosystem keeps its limit of 5 because a digest pin receives its fixes
# only through that stream (ADR-0249). Security updates continue: with the repository setting "Dependabot security
# updates" on, Dependabot opens a pull request whenever a published advisory affects a dependency, and the limit does
# not apply to those. Everything below — ignore rules, cooldown, groups — stays in place, so resuming means setting
# each paused limit back to 5.
#
# Updates are GROUPED per ecosystem. Ungrouped, a repository this size opens a pull request per package and buries the
# trunk in noise; grouped, a week's updates arrive as one reviewable change that CI verifies as a unit. Security updates
# have a group of their own in each ecosystem (`applies-to: security-updates`), so one advisory run is one pull request.
version: 2

updates:
  # The .NET family. Versions are centrally managed in Directory.Packages.props (ADR-0003), which Dependabot reads and
  # edits in place, so a bump stays lockstep across every project instead of drifting per-csproj.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Version updates paused (issue #36); 5 when resumed.
    open-pull-requests-limit: 0
    groups:
      # Patch/minor servicing moves together — this is the stream that clears NuGet advisories, which the full
      # Definition of Done treats as build errors (NU1901-1904), so leaving it to rot eventually breaks CI outright.
      nuget-minor-and-patch:
        update-types: [minor, patch]
      # Majors are separated: each one is a deliberate, individually-reviewed change.
      nuget-major:
        update-types: [major]
      nuget-security:
        applies-to: security-updates
        patterns: ['*']

  # The frontend pnpm workspace (ADR-0064). Its root is src/frontend, not the repository root — that is where
  # pnpm-workspace.yaml and the lockfile live, and pointing Dependabot anywhere else finds no manifest.
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    # Version updates paused (issue #36); 5 when resumed.
    open-pull-requests-limit: 0
    # A version must be three days old before Dependabot proposes it. It is the same window as pnpm's
    # minimumReleaseAge in src/frontend/pnpm-workspace.yaml, and must not be longer: Dependabot enforces this cooldown
    # on every version already in the lockfile, and pnpm's gate is what keeps a younger one out (ADR-0153). Equal
    # windows also mean Dependabot defers to pnpm's own setting. Dependabot's default is 3 days; it is stated here so a
    # change to that default cannot reopen the gap.
    cooldown:
      default-days: 3
    ignore:
      # `@types/node` describes the Node runtime, so its major must equal the one pinned in src/frontend/.node-version
      # (which CI, NVS, and the Aspire AppHost all read). Types from a newer major let code compile against APIs the
      # runtime lacks. Bump the runtime and this major together, deliberately (ADR-0147).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler) no longer ships the JavaScript compiler API that typescript-eslint parses
      # with, and typescript-eslint caps its peer range below it. Hold the 6.x line until it supports 7 (issue #147).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # The toolchain (vitest/vite/esbuild and friends) is where dev-only advisories land (issue #146 was cleared this
      # way); every one is a devDependency that never reaches the shipped bundle, so they are safe to move as a single
      # group. Its majors are coupled (vite + vitest + plugin-react; eslint + its plugins) and must move together anyway.
      frontend-dev-toolchain:
        dependency-type: development
      frontend-production:
        dependency-type: production
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  # The workflows themselves. Pinned action majors go stale silently and surface as runner deprecation warnings rather
  # than failures, so they need the same automation as package dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Version updates are paused (issue #36) for every action but NCodeGroup/code-review, which is pinned to a release's
    # commit SHA with its tag in a comment, so each bump arrives as a pull request that updates both. Resuming the others
    # means removing `allow`.
    open-pull-requests-limit: 5
    allow:
      - dependency-name: NCodeGroup/code-review
    groups:
      github-actions:
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  # The host image's base images (ADR-0249). A digest pin receives operating-system and runtime fixes only through this
  # stream, so it runs while issue #36 pauses the other ecosystems. A runtime major moves deliberately, together with
  # src/frontend/.node-version or the target framework, so semver-major updates are ignored.
  - package-ecosystem: docker
    directory: /src/NCode.Identity.OpenId.Host
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker-base-images:
        patterns: ['*']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
