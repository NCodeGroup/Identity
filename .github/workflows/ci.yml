# Continuous integration — the Definition of Done, enforced.
#
# This workflow runs the SAME entrypoint developers run (build/dod.ps1), with no CI-only variant of the gate: the
# script is the single source of truth for what "done" means (CONTRIBUTING.md), so a green run here and a green run
# locally mean the same thing. It deliberately runs the FULL gate (Release, coverage + packing, NuGet vulnerability
# advisories as errors) rather than the -Fast local pre-push accelerator.
#
# The repository is public, so standard-runner minutes are unmetered — the gate runs on every branch, via push for
# human branches and via the pull request for bot branches.
#
# Named for the tier it gates, pairing with "Frontend CI"; the JOB below keeps the repository's own term, so the
# required status check reads "Definition of Done".
name: .NET CI

on:
  push:
    # Every branch is gated on push. Bot branches are the one exception: they always carry an open pull request, so a
    # push trigger here would run the whole gate a second time against the same tree — four checks on one Dependabot
    # pull request instead of two. Human branches keep their push run, because a branch may have no pull request yet.
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the gate job only reads the tree, and nothing here publishes. The one write-scoped permission —
# `id-token: write`, to authenticate the Codecov upload over OIDC — belongs to the separate codecov job, never to the gate
# job that executes third-party build and test code (ADR-0143).
permissions:
  contents: read

# Supersede in-flight runs for the same ref while iterating on a branch, but give every trunk commit its own verdict.
#
# On main the group includes the SHA, so two trunk commits never share a group. That matters because
# `cancel-in-progress: false` alone does NOT achieve it: GitHub still cancels any previously *pending* run in a group,
# keeping only the newest. Under rapid pushes that silently leaves trunk commits unverified — a commit that broke
# something, followed by one that fixed it, would never report the break.
concurrency:
  group: dotnet-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  definition-of-done:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning computes the version from commit height and FAILS on a shallow clone, which is the
          # actions/checkout default. The full history is required, not an optimization to trim.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No lock files are committed, so setup-dotnet's built-in cache cannot key itself. Key on the central package
      # manifest plus every project file: those are exactly the inputs that change the restore graph (ADR-0003).
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The one gate. dod.ps1 sets CI=true internally, which promotes NuGet vulnerability advisories (NU1901-1904) to
      # errors on top of the always-on warnings-as-errors. Under GitHub Actions it also writes the job summary (stage
      # table, test results, coverage) and annotates failed tests and the failing stage (ADR-0143).
      - name: Definition of Done
        shell: pwsh
        run: ./build/dod.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.junit.xml
          retention-days: 14
          if-no-files-found: warn

      # The merged report: Cobertura.xml (what Codecov ingests) plus the browsable HTML report (index.html).
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 14
          if-no-files-found: warn

      # The full gate packs every shippable project (GeneratePackageOnBuild). Retaining the output makes a CI run
      # reproduce what a release would publish, without granting this workflow any publish permission.
      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: warn

  # Reporting, not gating: runs after the gate whatever its verdict (failed tests are still worth reporting), and is
  # never a required check.
  codecov:
    name: Codecov
    needs: definition-of-done
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/codecov-upload.yml
    with:
      flag: dotnet
      coverage-artifact: coverage
      test-results-artifact: test-results
