# Continuous integration — the Definition of Done, enforced.
#
# This workflow runs the SAME entrypoint developers run (build/dod.ps1), with no CI-only variant of the gate: the
# script is the single source of truth for what "done" means (CONTRIBUTING.md), so a green run here and a green run
# locally mean the same thing. It always runs in Release with coverage, packing and NuGet vulnerability advisories as
# errors; the gate tier only decides which tests run (ADR-1263). A pull request into main runs the tests affected by its
# change (-Affected against the pull request's base); the merge queue, a push to main or a release line, and a pull
# request into a release line run the FULL gate.
#
# The repository is public, so standard-runner minutes are unmetered — the gate runs on every branch, via push for
# human branches and via the pull request for bot branches.
#
# Named for the tier it gates, pairing with "Frontend CI"; the JOB below keeps the repository's own term, so the
# required status check reads "Definition of Done".
name: .NET CI

on:
  # A pull request into main runs the affected tests; the merge queue then runs the full gate on the merged result, so a
  # required check must report on merge_group (ADR-1263). Release lines are gated like main before the queue: a push
  # to main or a release line, and a pull request into a release line, run the full gate. A push trigger on other
  # branches would run the gate a second time for each commit of a branch with a pull request. Run a branch that has no
  # pull request yet with workflow_dispatch, or open a draft pull request.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Least privilege: the gate job only reads the tree, and nothing here publishes. The one write-scoped permission —
# `id-token: write`, to authenticate the Codecov upload over OIDC — belongs to the separate codecov job, never to the gate
# job that executes third-party build and test code (ADR-1143).
permissions:
  contents: read

# Supersede in-flight runs for the same ref while iterating on a branch, but give every commit of main and a release
# line its own verdict.
#
# On main and the release lines the group includes the SHA, so two commits of a protected line never share a group.
# That matters because `cancel-in-progress: false` alone does NOT achieve it: GitHub still cancels any previously
# *pending* run in a group, keeping only the newest. Under rapid pushes that silently leaves protected commits
# unverified — a commit that broke something, followed by one that fixed it, would never report the break.
concurrency:
  group: dotnet-ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || 'head' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  definition-of-done:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from commit height and FAILS on a shallow clone, which is the
          # actions/checkout default. The full history is required, not an optimization to trim.
          fetch-depth: 0
          # Nothing in this job pushes, so the token stays out of .git/config, where later steps could read it.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # A test project that targets an older .NET runs on that version's runtime, which build/Get-TestRuntimes.ps1 names.
      - name: Find the .NET runtimes the tests target
        id: runtimes
        shell: pwsh
        run: |
          $channels = @(./build/Get-TestRuntimes.ps1)
          if ($channels) { "channels<<EOF`n$($channels -join "`n")`nEOF" >> $env:GITHUB_OUTPUT }

      - name: Setup the .NET runtimes the tests target
        if: steps.runtimes.outputs.channels != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ steps.runtimes.outputs.channels }}

      # No lock files are committed, so setup-dotnet's built-in cache cannot key itself. Key on the central package
      # manifest plus every project file: those are exactly the inputs that change the restore graph (ADR-1003).
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The one gate. dod.ps1 sets CI=true internally, which promotes NuGet vulnerability advisories (NU1901-1904) to
      # errors on top of the always-on warnings-as-errors. Under GitHub Actions it also writes the job summary (stage
      # table, test results, coverage) and annotates failed tests and the failing stage (ADR-1143). A pull request into
      # main runs only the tests its change affects, measured from the base SHA (the checkout's full history holds its
      # merge base); every other event runs the full gate (ADR-1263).
      - name: Definition of Done
        shell: pwsh
        env:
          AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.base.sha || '' }}
        run: if ($env:AFFECTED_BASE) { ./build/dod.ps1 -Affected -Base $env:AFFECTED_BASE } else { ./build/dod.ps1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/*.junit.xml
          retention-days: 14
          if-no-files-found: warn

      # The merged report: Cobertura.xml (what Codecov ingests) plus the browsable HTML report (index.html).
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 14
          if-no-files-found: warn

      # The full gate packs every shippable project (GeneratePackageOnBuild). Retaining the output makes a CI run
      # reproduce what a release would publish, without granting this workflow any publish permission.
      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: warn

  # Reporting, not gating: runs after the gate whatever its verdict (failed tests are still worth reporting), and is
  # never a required check. Skipped in the merge queue: its run duplicates the coverage main's push uploads.
  codecov:
    name: Codecov
    needs: definition-of-done
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/codecov-upload.yml
    with:
      flag: dotnet
      coverage-artifact: coverage
      test-results-artifact: test-results
