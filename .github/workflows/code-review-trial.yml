name: Code review (trial)

# Phase 1 of the NCode Review agent (NCodeGroup/code-review): shadow mode, so it posts only a neutral "Code review"
# check run with annotations, never review comments, and nothing requires it. It reviews a pull request once when it
# opens (drafts included, since that's when its author reviews it) and again when it's marked ready; pushes in between
# start nothing. A `skip-review` label skips a pull request.
#
# pull_request_target runs this file, the engine pin and the conventions from main, so a pull request can't change its
# own review. Its code is checked out only to be read: nothing from it is built, run or installed.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    # Anthropic's federation rule trusts only jobs in this environment, which only main can deploy to.
    environment: code-review
    timeout-minutes: 30
    concurrency:
      group: code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out main for the conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Check out the pull request's head to read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: NCodeGroup/code-review@220a705fa37b4973e4ac78ccf48d5b2acd011190
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
