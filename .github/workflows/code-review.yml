name: Code review

# The NCode Review agent (NCodeGroup/code-review): as ncode-review[bot] it posts a neutral "Code review"
# check run, a summary comment and inline threads, and nothing requires it. It reviews a pull request once when it
# opens (drafts included, since that's when its author reviews it) and again when it's marked ready, unless that commit
# was already reviewed (the engine reads its own summary comment to tell); pushes in between start nothing. A top-level
# `/review` comment from someone with write access reviews the latest commit on demand. A `skip-review` label skips the
# automatic reviews.
#
# pull_request_target and issue_comment both run this file, the engine pin and the conventions from main, so a pull
# request can't change its own review. The engine fetches its code only to read it: nothing from it is built, run or
# installed.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # The engine checks a comment again (exactly `/review`, from a writer, on a pull request that isn't from a fork) and
    # stops before any model call when it isn't one.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'skip-review')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    # Anthropic's federation rule trusts only jobs in this environment, which only main can deploy to.
    environment: code-review
    timeout-minutes: 30
    concurrency:
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      # The issues a pull request closes are context for its intent.
      issues: read
      pull-requests: read
    steps:
      - name: Check out main for the conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Review
        # A release's full commit SHA, with its tag in the comment: the action receives the app key and the Bedrock key,
        # and a SHA is the one pin nobody can move. Dependabot opens each bump and updates both.
        uses: NCodeGroup/code-review@eaa9846049fdda1ce724fc34107391ba5f6d8708 # v0.3.1
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
