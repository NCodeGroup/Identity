# Commit attribution — commits are attributed to people, not agents (ADR-1128).
#
# This workflow runs .template/Test-CommitAttribution.ps1, from the project template, which rejects any commit whose
# author or committer is an AI agent account, or whose message carries attribution from any AI agent or model (a
# `Co-authored-by:` line that names an agent or model or uses an agent's address, an agent session trailer such as
# `Claude-Session:`, a "Generated with" or "Generated by" line that names an AI tool, or a line that holds only a link
# to an agent's session or task).
#
# The merge queue run matters most: when GitHub squashes a pull request it writes a `Co-authored-by:` trailer for every
# commit author into the commit that lands, so an agent that authored any commit of the pull request would be credited
# on main even though the pull request's own commits were checked. Checking the merge group's commit covers those
# trailers. A pull request is checked from its base to its head, the merge queue from the merge group's base to its
# head, and a push from the commit before the push to the commit after it.
#
# A pull request's title and description are checked too: the squash merge makes them the message of the commit that
# lands on main (ADR-1304), so the check runs again when a pull request is edited.
#
# A separate workflow, rather than a step of the .NET gate, keeps this check independent of that gate's concurrency
# group, and it finishes in seconds.
name: Commit attribution

on:
  # The merge queue checks the commit that lands, including the trailers GitHub writes when it squashes, so a required
  # check must report on merge_group.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
    # edited: the check reads the pull request's title and description, so it runs again when they change.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

# Least privilege: the job only reads the tree.
permissions:
  contents: read

jobs:
  commit-attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check walks the commits between the base and the head, so it needs their history, not a shallow clone.
          fetch-depth: 0
          # Nothing in this job pushes, so the token stays out of .git/config, where later steps could read it.
          persist-credentials: false

      # The expressions are GitHub's, not PowerShell's, so they are passed through env rather than interpolated into
      # the script. A push to a new branch has an all-zero `before`, for which the script checks only the head.
      - name: Check commit attribution
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./.template/Test-CommitAttribution.ps1 -Base $env:BASE -Head $env:HEAD -PullRequestTitle $env:PR_TITLE -PullRequestBody $env:PR_BODY
