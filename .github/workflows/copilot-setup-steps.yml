# The Copilot cloud agent's environment, prepared before each session: GitHub runs this workflow's one job on the
# session's fresh runner, so the agent starts with the project's toolchain and packages instead of installing them
# itself. GitHub reads the job only from the default branch and only under the name copilot-setup-steps, and takes only
# its steps, permissions, runs-on, services, snapshot and timeout-minutes, so each step names its own shell. When a step
# fails, the rest are skipped and the session starts anyway. The push and pull_request triggers run it when this file
# changes, to show it still works. Beyond the template's .NET steps, it installs the frontend's Node and pnpm, which the
# runner image doesn't ship. How to size a session so it fits its 59 minutes: AGENTS.md, "Copilot cloud agent sessions".
name: Copilot Setup Steps

on:
  workflow_dispatch:
  # A push runs only on main, because a pull request already runs every other branch (see ci.yml).
  push:
    branches: [main]
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # The session's limit too, counted from this job's start: 59 is the most Copilot allows.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      # The agent gets a token of its own, so the checkout keeps none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK global.json selects and the runtime of each older .NET a test project targets.
      - uses: ./.github/actions/install-dotnet
      # The same key as CI's, so a session reuses the packages CI restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore tools
        if: hashFiles('.config/dotnet-tools.json') != ''
        shell: pwsh
        run: dotnet tool restore
      - name: Restore packages
        if: hashFiles('*.sln', '*.slnx') != ''
        shell: pwsh
        run: dotnet restore
      # The Node major and the pnpm version are each pinned once (ADR-1152); these steps read the same pins the
      # Frontend CI workflow reads.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/frontend/.node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
          cache: true
          cache_dependency_path: src/frontend/pnpm-lock.yaml
      - name: Install frontend packages
        working-directory: src/frontend
        shell: bash
        run: pnpm install --frozen-lockfile
