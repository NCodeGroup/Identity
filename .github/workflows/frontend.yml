# Frontend continuous integration (backlog U5).
#
# The frontend toolchain is deliberately OUTSIDE build/dod.ps1: that gate is the .NET Definition of Done, and making it
# shell out to Node would couple a .NET contributor's inner loop to a pnpm install. This workflow gates the frontend
# tier independently instead.
#
# It is path-filtered, so a C#-only push does not pay for a pnpm install. The consequence to know when configuring
# branch protection: a pull request that touches no frontend file never reports this check, so it must NOT be marked
# required — require the .NET "Definition of Done" check instead.
name: Frontend CI

on:
  push:
    branches: ['**']
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: src/frontend

jobs:
  frontend:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corepack activates the pnpm version pinned by the workspace's "packageManager" field, so CI and a developer
      # machine run byte-identical tooling. It must run BEFORE setup-node, because setup-node's pnpm cache resolution
      # shells out to pnpm to locate the store.
      - name: Enable Corepack
        run: corepack enable
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches the Node major the Aspire AppHost expects locally (ADR-0071) and satisfies the workspace's
          # "engines" floor.
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      # --frozen-lockfile makes the lockfile authoritative: CI fails rather than silently resolving a different tree
      # when a manifest and the lockfile disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs as its own step so a failure names the stage that broke, rather than one opaque "turbo failed".
      # `if: always()` past the first means one red stage still reports the others instead of masking them.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        if: always()
        run: pnpm run lint

      - name: Typecheck
        if: always()
        run: pnpm run typecheck

      - name: Test
        if: always()
        run: pnpm run test

      - name: Build
        if: always()
        run: pnpm run build
