# Frontend continuous integration (backlog U5).
#
# The frontend toolchain is deliberately OUTSIDE build/dod.ps1: that gate is the .NET Definition of Done, and making it
# shell out to Node would couple a .NET contributor's inner loop to a pnpm install. This workflow gates the frontend
# tier independently instead.
#
# It is path-filtered, so a C#-only push does not pay for a pnpm install. The consequence to know when configuring
# branch protection: a pull request that touches no frontend file never reports this check, so it must NOT be marked
# required — require the .NET "Definition of Done" check instead.
name: Frontend CI

on:
  push:
    # See the note in ci.yml: bot branches always carry an open pull request, so a push trigger would duplicate the
    # whole run against the same tree.
    branches-ignore: ['dependabot/**']
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# See the note in ci.yml: on main the group includes the SHA so every trunk commit keeps its own verdict, because
# `cancel-in-progress: false` alone still lets GitHub cancel previously pending runs in the same group.
concurrency:
  group: frontend-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: src/frontend

jobs:
  frontend:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corepack ships with Node and provides the `pnpm` shim. Enabling it is what lets the workspace's
      # "packageManager" pin decide the pnpm version, so CI and a developer machine run identical tooling.
      - name: Enable Corepack
        run: corepack enable
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches the Node major the Aspire AppHost expects locally (ADR-0071) and satisfies the workspace's
          # "engines" floor.
          node-version: 22

      # Materialize the pnpm version pinned by the workspace's "packageManager" field, so `pnpm` is a real binary
      # before anything asks it for a path.
      #
      # setup-node's built-in `cache: pnpm` deliberately is NOT used: it resolves the store location during its own
      # setup step, which runs before Corepack has downloaded pnpm, so it registers a path that never comes into
      # existence and then fails the job at post-job cleanup with "Path Validation Error: Path(s) specified in the
      # action for caching do(es) not exist" — after every check has already passed. Resolving the store ourselves,
      # once pnpm genuinely exists, is what makes the cache real.
      - name: Activate pnpm
        run: corepack prepare --activate

      - name: Resolve the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # --frozen-lockfile makes the lockfile authoritative: CI fails rather than silently resolving a different tree
      # when a manifest and the lockfile disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs as its own step so a failure names the stage that broke, rather than one opaque "turbo failed".
      # `if: always()` past the first means one red stage still reports the others instead of masking them.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        if: always()
        run: pnpm run lint

      - name: Typecheck
        if: always()
        run: pnpm run typecheck

      - name: Test
        if: always()
        run: pnpm run test

      - name: Build
        if: always()
        run: pnpm run build
