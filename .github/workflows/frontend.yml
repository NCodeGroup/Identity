# Frontend continuous integration (backlog U5).
#
# The frontend toolchain is deliberately OUTSIDE build/dod.ps1: that gate is the .NET Definition of Done, and making it
# shell out to Node would couple a .NET contributor's inner loop to a pnpm install. This workflow gates the frontend
# tier independently instead.
#
# A push to main or a release line is path-filtered, so a C#-only push does not pay for a pnpm install. A pull request
# and the merge queue always run the workflow, and the `changes` job decides whether the frontend job runs. A skipped
# job reports success, so every pull request reports "Lint, typecheck, test, build", which is a required check of the
# main ruleset (ADR-0261).
name: Frontend CI

on:
  # See the note in ci.yml: a push gates only main and the release lines, because a pull request already gates every
  # other branch. A pull request always runs the workflow, so its required check reports; the `changes` job skips the
  # frontend job when no frontend path changed. The merge queue runs the check on the merged result, so a required check
  # must report on merge_group too (ADR-0263); it always runs the frontend job. Release lines are gated like main: a
  # push to either keeps the path filter.
  push:
    branches: [main, 'release/**']
    # Keep in sync with the pattern in the `changes` job, which applies the same paths to a pull request.
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/codecov-upload.yml'
      - 'build/test-report.ps1'
      - 'build/coverage-report.ps1'
      - '.config/dotnet-tools.json'
      - 'src/NCode.Identity.OpenId.Authentication.Interactive/**'
      - 'tests/NCode.Identity.OpenId.Authentication.Interactive.Tests/**'
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# The frontend job only reads the tree; `id-token: write` (the Codecov OIDC upload) belongs to the separate codecov job
# alone (ADR-0143).
permissions:
  contents: read

# See the note in ci.yml: on main and the release lines the group includes the SHA so every commit of a protected line
# keeps its own verdict, because `cancel-in-progress: false` alone still lets GitHub cancel previously pending runs in
# the same group.
concurrency:
  group: frontend-ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || 'head' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

defaults:
  run:
    working-directory: src/frontend

jobs:
  # Decides from a pull request's changed files whether the frontend job runs; every event other than pull_request, the
  # merge queue included, always runs it.
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep the pattern in sync with the `push` trigger's `paths` list.
      - name: Diff against the base
        id: diff
        shell: bash
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          pattern='^(src/frontend/|\.github/workflows/frontend\.yml$|\.github/workflows/codecov-upload\.yml$|build/test-report\.ps1$|build/coverage-report\.ps1$|\.config/dotnet-tools\.json$|src/NCode\.Identity\.OpenId\.Authentication\.Interactive/|tests/NCode\.Identity\.OpenId\.Authentication\.Interactive\.Tests/)'
          # Capture the list first: piping into `grep -q` under pipefail fails on a large diff, because grep exits at
          # the first match and `git diff` then dies of SIGPIPE, which reads as "no frontend change".
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -Eq "$pattern" <<< "$changed"; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  frontend:
    name: Lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The built-bundle step runs `dotnet test`, and Nerdbank.GitVersioning computes the version from commit
          # height and FAILS on a shallow clone, which is the actions/checkout default. The full history is required.
          fetch-depth: 0

      # The Node major is pinned once, in src/frontend/.node-version, which is the same file NVS selects locally and the
      # Aspire AppHost reads (ADR-0152), so CI runs the runtime a developer machine runs.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.node-version

      # Installs the exact pnpm the workspace's "packageManager" field pins (Node no longer bundles Corepack, which used
      # to provide it), so CI and a developer machine run identical tooling. It also caches the pnpm store, resolving
      # the store path after pnpm exists. setup-node's own `cache: pnpm` resolves it earlier, before pnpm is installed,
      # and then fails the job at post-job cleanup ("Path Validation Error") after every check has passed.
      # A third-party action, so it is pinned to a commit; Dependabot moves the pin and its version comment together.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
          cache: true
          cache_dependency_path: src/frontend/pnpm-lock.yaml

      # --frozen-lockfile makes the lockfile authoritative: CI fails rather than silently resolving a different tree
      # when a manifest and the lockfile disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs as its own step so a failure names the stage that broke, rather than one opaque "turbo failed".
      # `if: always()` past the first means one red stage still reports the others instead of masking them.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        if: always()
        run: pnpm run lint

      - name: Typecheck
        if: always()
        run: pnpm run typecheck

      # The same Vitest run as `pnpm test`, plus a JUnit report (<package>/test-results/junit.xml) and Cobertura + HTML
      # coverage (<package>/coverage/) per package, for the reports below and Codecov. `test:report` runs turbo with
      # --continue=always: by default turbo cancels the remaining packages' tests when one fails, which leaves their
      # JUnit files empty and the report missing exactly the packages nobody looked at.
      - name: Test
        id: test
        if: always()
        run: pnpm run test:report

      # The shared reporter the .NET gate also uses: one table in the job summary, failed tests annotated in place.
      - name: Test report
        if: always()
        shell: pwsh
        working-directory: .
        run: ./build/test-report.ps1 -Path 'src/frontend/*/*/test-results/junit.xml' -Title 'Frontend tests'

      # .NET renders the coverage report with the same ReportGenerator tool (pinned in .config/dotnet-tools.json) as the
      # .NET coverage, so both tiers present coverage identically, and it runs the host's test against the built login
      # bundle below. Vitest writes no coverage when a test fails, so the coverage report follows a passing test step
      # only.
      - name: Setup .NET
        if: always()
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Coverage report
        if: steps.test.outcome == 'success'
        shell: pwsh
        working-directory: .
        run: |
          dotnet tool restore
          ./build/coverage-report.ps1 -Path 'src/frontend/*/*/coverage/cobertura-coverage.xml' -TargetDirectory artifacts/frontend-coverage -Title 'Frontend coverage' -ArtifactName frontend-coverage -PerPackageReports

      - name: Build
        id: build
        if: always()
        run: pnpm run build

      # The host splits the built login bundle's `index.html` around its mount point and serves its `assets` directory
      # (ADR-0254). The .NET Definition of Done builds no frontend, so the split is tested here, against the real build.
      - name: Test the host against the built login bundle
        if: steps.build.outcome == 'success'
        shell: pwsh
        working-directory: .
        env:
          NCODE_AUTH_BUNDLE_INDEX: ${{ github.workspace }}/src/frontend/apps/auth/dist/index.html
        run: dotnet test tests/NCode.Identity.OpenId.Authentication.Interactive.Tests/NCode.Identity.OpenId.Authentication.Interactive.Tests.csproj --nologo --filter "FullyQualifiedName~InteractiveBundleShellTests.TryCreate_WhenGivenTheBuiltBundlesIndex" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: src/frontend/*/*/test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: artifacts/frontend-coverage/
          retention-days: 14
          if-no-files-found: warn

  # Reporting, not gating — see ci.yml.
  codecov:
    name: Codecov
    needs: frontend
    # A skipped frontend job leaves nothing to upload, and the merge queue's run duplicates the coverage main's push
    # uploads.
    if: ${{ !cancelled() && needs.frontend.result != 'skipped' && github.event_name != 'merge_group' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/codecov-upload.yml
    with:
      flag: frontend
      coverage-artifact: frontend-coverage
      test-results-artifact: frontend-test-results
