# Host chart — lints and renders the Helm chart of NCode.Identity.OpenId.Host (ADR-1179).
#
# The chart encodes the host's configuration surface, so it changes with the host and is checked on every change: each
# values file under ci/ must lint strictly and render, and each release the chart must refuse — the host would refuse
# it, or its replicas would not share state — must fail to render. The pre-deploy migration Job must render unless
# disabled (ADR-1180). The chart's management console component is checked too: it must render on a host of its own
# that routes every path to the console, call the management API at its authority's origin, stay opt-in (ADR-1458,
# ADR-1488), and hold its key rings in a key management service under its own identity (ADR-1485). A server remote key
# provider is registered only when enabled, with or without its location (ADR-1490).
# The pods serve HTTPS only: the probes, the Service and the Ingress backend use it, a cert-manager Certificate issues
# the certificate, and the chosen controller verifies it (ADR-1504). The pods can require the ingress controller's
# client certificate, and the chart's ingress certificate and its Secret are checked. The job installs the chart in kind
# behind each controller (ADR-1506).
# The Publish artifacts workflow publishes the chart (ADR-1505).
name: Host chart

on:
  # A push gates only main and the release lines, because a pull request already gates every other branch (see ci.yml).
  # The merge queue runs the check on the merged result, so a required check must report on merge_group (ADR-1263).
  # Release lines are gated like main.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# See the note in ci.yml: on main and the release lines the group includes the SHA so every commit of a protected line
# keeps its own verdict.
concurrency:
  group: host-chart-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || 'head' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  check:
    name: Lint and render the host chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CHART: charts/ncode-identity-host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the token stays out of .git/config, where later steps could read it.
          persist-credentials: false

      # A third-party action, so it is pinned to a commit; Dependabot moves the pin and its version comment together.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint and render each supported release
        run: |
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::$values"
            helm lint --strict "$CHART" --values "$values"
            helm template release "$CHART" --values "$values" > /dev/null
            echo "::endgroup::"
          done

      - name: Refuse each unsafe release
        run: |
          base="$CHART/ci/single-replica-values.yaml"
          refuse() {
            if helm template release "$CHART" --values "$base" "$@" > /dev/null 2>&1; then
              echo "::error::The chart rendered a release it must refuse: $*"
              exit 1
            fi
          }
          refuse --set replicaCount=2
          refuse --set 'allowedHosts={*}'
          refuse --set-json 'allowedHosts=[]'
          refuse --set 'allowedHosts={*.example.com}'
          refuse --set database.existingSecret=
          refuse --set secretProtection.rootKeyProvider=
          refuse --set secretProtection.rootKeyProvider=ephemeral
          refuse --set environment=Staging --set secretProtection.rootKeyProvider=
          refuse --set secretProtection.local.keySecret=
          refuse --set secretProtection.rootKeyProvider=aws-kms
          refuse --set secretProtection.rootKeyProvider=aws-kms --set secretProtection.awsKms.keyArn=not-an-arn
          refuse --set secretProtection.rootKeyProvider=azure-key-vault
          refuse --set secretProtection.rootKeyProvider=azure-key-vault --set secretProtection.azureKeyVault.keyId=https://contoso.vault.azure.net/secrets/root
          refuse --set secretProtection.rootKeyProvider=azure-key-vault --set secretProtection.azureKeyVault.keyId=https://contoso.vault.azure.net/keys/root --set secretProtection.azureKeyVault.workloadIdentity.clientId=00000000-0000-0000-0000-000000000000
          refuse --set secretProtection.rootKeyProvider=google-cloud-kms
          refuse --set secretProtection.rootKeyProvider=google-cloud-kms --set secretProtection.googleCloudKms.keyName=projects/p/locations/global/keyRings/r/cryptoKeys/k/cryptoKeyVersions/1
          refuse --set secretProtection.rootKeyProvider=google-cloud-kms --set secretProtection.googleCloudKms.keyName=projects/p/locations/global/keyRings/r/cryptoKeys/k --set secretProtection.googleCloudKms.workloadIdentityFederation.provider=not-a-provider
          refuse --set 'secretProtection.ownerRootKeys.providers={azure-key-vault}' --set secretProtection.azureKeyVault.workloadIdentity.clientId=00000000-0000-0000-0000-000000000000
          refuse --set 'secretProtection.ownerRootKeys.providers={google-cloud-kms}' --set secretProtection.googleCloudKms.workloadIdentityFederation.provider=bad
          refuse --set 'secretProtection.ownerRootKeys.providers={nope}'
          refuse --set secretProtection.remoteKeyProviders.awsKms.enabled=true --set secretProtection.remoteKeyProviders.awsKms.region=Not_A_Region
          refuse --set secretProtection.remoteKeyProviders.awsKms.enabled=true --set secretProtection.remoteKeyProviders.awsKms.pendingWindowInDays=6
          refuse --set secretProtection.remoteKeyProviders.awsKms.enabled=true --set secretProtection.remoteKeyProviders.awsKms.region=us-west-2 --set secretProtection.remoteKeys.deployment=
          refuse --set secretProtection.remoteKeyProviders.azureKeyVault.enabled=true --set secretProtection.remoteKeyProviders.azureKeyVault.vaultUri=http://contoso.vault.azure.net
          refuse --set secretProtection.remoteKeyProviders.googleCloudKms.enabled=true --set secretProtection.remoteKeyProviders.googleCloudKms.keyRing=projects/p/locations/l/keyRings/r/cryptoKeys/k
          refuse --set secretProtection.remoteKeyProviders.azureKeyVault.enabled=true --set secretProtection.azureKeyVault.workloadIdentity.clientId=00000000-0000-0000-0000-000000000000
          refuse --set secretProtection.remoteKeyProviders.awsKms.enabled=yes
          # A location registers nothing on its own: its vendor is enabled explicitly (ADR-1490).
          refuse --set secretProtection.remoteKeyProviders.awsKms.region=us-west-2
          refuse --set secretProtection.remoteKeyProviders.azureKeyVault.vaultUri=https://contoso.vault.azure.net
          refuse --set secretProtection.remoteKeyProviders.googleCloudKms.keyRing=projects/my-project/locations/us-central1/keyRings/ncode-identity-tenant-keys
          refuse --set secretProtection.recovery.publicKeyConfigMap=
          refuse --set tenantResolution.staticSingle.issuer=
          refuse --set tenantResolution.staticSingle.issuer=http://id.example.com
          refuse --set unknownSetting=true
          refuse --set backendTls.ingressController=haproxy
          refuse --set backendTls.certManager.issuerRef.kind=Deployment
          refuse --set backendTls.certManager.duration=90d
          refuse --set backendTls.certManager.renewBefore=2160h
          refuse --set backendTls.certManager.privateKey.size=1024
          refuse --set backendTls.certManager.privateKey.algorithm=RSA --set backendTls.certManager.privateKey.size=256
          refuse --set backendTls.clientCertificate.commonName=
          refuse --set 'backendTls.clientCertificate.commonName=a b'
          refuse --set backendTls.clientCertificate.required=yes
          # The chart cannot know the CA behind a serving Secret of the operator's, so the controller's Secret is required.
          refuse_console() {
            if helm template release "$CHART" --values "$CHART/ci/management-console-values.yaml" "$@" > /dev/null 2>&1; then
              echo "::error::The chart rendered a release it must refuse: $*"
              exit 1
            fi
          }
          refuse_console --set backendTls.existingSecret=my-tls
          refuse_console --set managementConsole.backendTls.existingSecret=my-console-tls
          helm template release "$CHART" --values "$CHART/ci/management-console-values.yaml" \
            --set backendTls.existingSecret=my-tls --set backendTls.ingressSecret=my-ingress > /dev/null

      - name: Migrate before the rollout unless disabled
        run: |
          base="$CHART/ci/single-replica-values.yaml"
          if ! helm template release "$CHART" --values "$base" | grep -q 'helm.sh/hook: pre-install,pre-upgrade'; then
            echo "::error::The chart rendered no pre-deploy migration Job."
            exit 1
          fi
          if helm template release "$CHART" --values "$base" --set migrations.enabled=false | grep -q 'helm.sh/hook'; then
            echo "::error::The chart rendered a migration Job with migrations.enabled=false."
            exit 1
          fi

      - name: Register a remote key provider and carry its credentials only when it is enabled
        run: |
          base="$CHART/ci/single-replica-values.yaml"
          role="secretProtection.awsKms.webIdentity.roleArn=arn:aws:iam::111122223333:role/x"
          aws="secretProtection.remoteKeyProviders.awsKms"
          expect() {
            local rendered="$1"; shift
            for expected in "$@"; do
              if ! grep -q -- "$expected" <<< "$rendered"; then
                echo "::error::The release lacks: $expected"
                exit 1
              fi
            done
          }
          reject() {
            local rendered="$1"; shift
            for unexpected in "$@"; do
              if grep -q -- "$unexpected" <<< "$rendered"; then
                echo "::error::The release renders what it must not: $unexpected"
                exit 1
              fi
            done
          }
          # A provider that is not enabled is not registered, and the pods carry none of its credentials.
          reject "$(helm template release "$CHART" --values "$base" --set "$role")" 'AWS_ROLE_ARN' 'RemoteKeyProviders'
          # Enabled without its location, a provider binds keys and creates none, so it needs no deployment (ADR-1490).
          binding=$(helm template release "$CHART" --values "$base" --set "$role" --set "$aws.enabled=true" \
            --set secretProtection.remoteKeys.deployment=)
          expect "$binding" 'AWS_ROLE_ARN' 'SecretProtection__RemoteKeyProviders__AwsKms__PendingWindowInDays'
          reject "$binding" 'SecretProtection__RemoteKeyProviders__AwsKms__Region' \
            'SecretProtection__RemoteKeys__Deployment'
          # Enabled with its location, a provider creates keys under the release's deployment.
          creating=$(helm template release "$CHART" --values "$base" --set "$role" --set "$aws.enabled=true" \
            --set "$aws.region=us-west-2")
          expect "$creating" 'AWS_ROLE_ARN' 'SecretProtection__RemoteKeyProviders__AwsKms__Region' \
            'SecretProtection__RemoteKeys__Deployment'
          # Every vendor binds without its location.
          bound=$(helm template release "$CHART" --values "$CHART/ci/bind-only-remote-key-providers-values.yaml")
          expect "$bound" 'SecretProtection__RemoteKeyProviders__AzureKeyVault__HardwareProtected' \
            'SecretProtection__RemoteKeyProviders__GoogleCloudKms__HardwareProtected' 'AZURE_CLIENT_ID' \
            'GOOGLE_APPLICATION_CREDENTIALS'
          reject "$bound" '__AwsKms__Region' '__AzureKeyVault__VaultUri' '__GoogleCloudKms__KeyRing' \
            'SecretProtection__RemoteKeys__Deployment'

      - name: Give the migration Job the host's extra settings and a valid name
        run: |
          base="$CHART/ci/single-replica-values.yaml"
          job=$(helm template release "$CHART" --values "$base" --show-only templates/migration-job.yaml \
            --set-json 'extraEnv=[{"name":"PGSSLMODE","value":"verify-full"}]' \
            --set-json 'extraVolumes=[{"name":"pg-ca","secret":{"secretName":"pg-ca"}}]' \
            --set-json 'extraVolumeMounts=[{"name":"pg-ca","mountPath":"/etc/pg-ca"}]')
          # fsGroup lets the non-root worker read a mounted secret, as it lets the host.
          for expected in 'name: PGSSLMODE' 'mountPath: /etc/pg-ca' 'secretName: pg-ca' 'fsGroup: 1654'; do
            if ! grep -q "$expected" <<< "$job"; then
              echo "::error::The migration Job lacks the host's extra setting or volume: $expected"
              exit 1
            fi
          done
          # Kubernetes copies the Job's name into a label value, which is limited to 63 characters.
          name=$(helm template a-fifty-three-character-release-name-for-the-job-test "$CHART" --values "$base" \
            --show-only templates/migration-job.yaml | awk '/^  name:/ { print $2; exit }')
          if [ "${#name}" -gt 63 ]; then
            echo "::error::The migration Job name '$name' is longer than 63 characters."
            exit 1
          fi

      - name: Never run two replicas at once without Valkey
        run: |
          if ! helm template release "$CHART" --values "$CHART/ci/single-replica-values.yaml" \
            --show-only templates/deployment.yaml | grep -q 'type: Recreate'; then
            echo "::error::A release without Valkey must use the Recreate strategy."
            exit 1
          fi

      - name: Serve HTTPS and verify the pods' certificate
        run: |
          base="$CHART/ci/single-replica-values.yaml"
          expect() {
            local rendered="$1"; shift
            for expected in "$@"; do
              if ! grep -q -- "$expected" <<< "$rendered"; then
                echo "::error::The release lacks: $expected"
                exit 1
              fi
            done
          }
          reject() {
            local rendered="$1"; shift
            for unexpected in "$@"; do
              if grep -q -- "$unexpected" <<< "$rendered"; then
                echo "::error::The release renders what it must not: $unexpected"
                exit 1
              fi
            done
          }
          # The pods listen on the TLS port, the host binds it from the environment, and the certificate is mounted.
          deployment=$(helm template release "$CHART" --values "$base" --show-only templates/deployment.yaml)
          expect "$deployment" 'containerPort: 8443' 'value: "https://+:8443"' 'mountPath: /etc/ncode-identity/tls'
          reject "$deployment" 'containerPort: 8080'
          # The startup, liveness and readiness probes all use HTTPS.
          if [ "$(grep -c 'scheme: HTTPS' <<< "$deployment")" -ne 3 ]; then
            echo "::error::The server's three probes must use HTTPS."
            exit 1
          fi
          # Without a Secret of the operator's, cert-manager issues the certificate from a private CA of the release.
          expect "$(helm template release "$CHART" --values "$base")" 'kind: Certificate' \
            'name: release-ncode-identity-host-tls' 'selfSigned: {}' 'name: release-ncode-identity-host-ca'
          # A Secret of the operator's replaces the Certificate. The whole chart is rendered because --show-only fails on
          # a template that renders nothing.
          existing=$(helm template release "$CHART" --values "$base" --set backendTls.existingSecret=my-tls)
          reject "$existing" 'kind: Certificate'
          expect "$existing" 'secretName: my-tls'
          # An issuer of the operator's replaces the private CA.
          reject "$(helm template release "$CHART" --values "$base" --set backendTls.certManager.issuerRef.name=corp-ca)" \
            'selfSigned'
          # The controller verifies the pods' certificate: Traefik through a ServersTransport, ingress-nginx through
          # annotations, and any other controller through the operator's own configuration.
          ha="$CHART/ci/high-availability-values.yaml"
          expect "$(helm template release "$CHART" --values "$ha")" 'kind: ServersTransport'
          nginx=$(helm template release "$CHART" --values "$ha" --set backendTls.ingressController=ingress-nginx)
          expect "$nginx" 'backend-protocol: HTTPS' 'proxy-ssl-verify: "on"' \
            'proxy-ssl-secret: default/release-ncode-identity-host-ingress'
          reject "$nginx" 'ServersTransport'
          reject "$(helm template release "$CHART" --values "$ha" --set backendTls.ingressController=none)" \
            'ServersTransport' 'nginx.ingress.kubernetes.io'
          # The console's Certificate needs the private CA even when the server's Secret is the operator's.
          console_only=$(helm template release "$CHART" --values "$CHART/ci/management-console-values.yaml" \
            --set backendTls.existingSecret=my-tls --set backendTls.ingressSecret=my-ingress)
          expect "$console_only" 'selfSigned: {}' 'kind: Issuer' 'name: release-ncode-identity-host-management-console-tls'
          # Secrets of the operator's for every component leave no Certificate that needs the private CA.
          reject "$(helm template release "$CHART" --values "$CHART/ci/backend-tls-existing-secret-values.yaml")" 'selfSigned'
          # The management console serves HTTPS with a certificate of its own.
          console=$(helm template release "$CHART" --values "$CHART/ci/management-console-values.yaml")
          if [ "$(grep -c 'scheme: HTTPS' <<< "$console")" -ne 6 ]; then
            echo "::error::The server's and the management console's probes must all use HTTPS."
            exit 1
          fi
          expect "$console" 'name: release-ncode-identity-host-management-console-tls'
          # The pods require the ingress controller's client certificate only when asked: the server and the console
          # receive the requirement, and Traefik names the certificate in each ServersTransport.
          console_values="$CHART/ci/management-console-values.yaml"
          reject "$(helm template release "$CHART" --values "$console_values")" 'ProxyClientCertificate'
          required=$(helm template release "$CHART" --values "$console_values" --set backendTls.clientCertificate.required=true)
          expect "$required" 'ProxyClientCertificate__Required' 'ProxyClientCertificate__CertificateAuthorityPath' \
            'ProxyClientCertificate__AllowedSubjects__0' 'certificatesSecrets:'
          if [ "$(grep -c 'ProxyClientCertificate__Required' <<< "$required")" -ne 2 ]; then
            echo "::error::The server and the management console must both require the ingress controller's certificate."
            exit 1
          fi
          # ingress-nginx reads the client certificate from the same Secret as the CA.
          expect "$(helm template release "$CHART" --values "$console_values" --set backendTls.clientCertificate.required=true \
            --set backendTls.ingressController=ingress-nginx)" 'proxy-ssl-secret: default/release-ncode-identity-host-ingress'
          # A Secret the operator names is the only Secret a controller verifies against, and the default is the chart's
          # ingress Secret, never a serving Secret. Traefik lists the Secret as "- <name>" in each ServersTransport and
          # ingress-nginx renders "proxy-ssl-secret: default/<name>" unquoted.
          count() {
            local actual
            actual=$(grep -c -- "$2" <<< "$1" || true)
            if [ "$actual" -ne "$3" ]; then
              echo "::error::The release renders '$2' $actual times, not $3."
              exit 1
            fi
          }
          traefik=$(helm template release "$CHART" --values "$console_values")
          nginx=$(helm template release "$CHART" --values "$console_values" --set backendTls.ingressController=ingress-nginx)
          count "$traefik" '- release-ncode-identity-host-ingress' 2
          reject "$traefik" '- release-ncode-identity-host-tls' '- release-ncode-identity-host-management-console-tls'
          count "$nginx" 'proxy-ssl-secret: default/release-ncode-identity-host-ingress' 2
          reject "$nginx" 'proxy-ssl-secret: default/release-ncode-identity-host-tls' \
            'proxy-ssl-secret: default/release-ncode-identity-host-management-console-tls'
          # Secrets of the operator's for the server and the console are the only ones either controller verifies against.
          both_args=(--set backendTls.ingressSecret=server-ca --set managementConsole.backendTls.ingressSecret=console-ca)
          traefik=$(helm template release "$CHART" --values "$console_values" "${both_args[@]}")
          nginx=$(helm template release "$CHART" --values "$console_values" "${both_args[@]}" \
            --set backendTls.ingressController=ingress-nginx)
          for rendered in "$traefik" "$nginx"; do
            expect "$rendered" 'server-ca' 'console-ca'
            reject "$rendered" '- release-ncode-identity-host-tls' '- release-ncode-identity-host-management-console-tls' \
              'proxy-ssl-secret: default/release-ncode-identity-host-tls' \
              'proxy-ssl-secret: default/release-ncode-identity-host-management-console-tls' \
              'release-ncode-identity-host-ingress'
          done
          # The console falls back to the server's Secret, never to its own serving Secret.
          traefik=$(helm template release "$CHART" --values "$console_values" --set backendTls.ingressSecret=server-ca)
          nginx=$(helm template release "$CHART" --values "$console_values" --set backendTls.ingressSecret=server-ca \
            --set backendTls.ingressController=ingress-nginx)
          for rendered in "$traefik" "$nginx"; do
            count "$rendered" 'server-ca' 2
            reject "$rendered" '- release-ncode-identity-host-management-console-tls' \
              'proxy-ssl-secret: default/release-ncode-identity-host-management-console-tls'
          done

      - name: Deploy the management console on its own host
        run: |
          base="$CHART/ci/management-console-values.yaml"
          refuse() {
            if helm template release "$CHART" --values "$base" "$@" > /dev/null 2>&1; then
              echo "::error::The chart rendered a management console release it must refuse: $*"
              exit 1
            fi
          }
          refuse --set managementConsole.host=
          refuse --set 'managementConsole.host=*.example.com'
          refuse --set managementConsole.authority=http://id.example.com
          refuse --set managementConsole.managementApiUrl=https://manage.example.com/api
          refuse --set tenantResolution.strategyCode=DynamicByHost --set tenantResolution.staticSingle.issuer=
          refuse --set managementConsole.keyRings.client.pemSecret=
          refuse --set managementConsole.keyRings.dpop.pemSecret=
          refuse --set managementConsole.replicaCount=2
          # Every path of the console's host reaches the console; the server answers only at its own hosts (ADR-1488).
          ingress=$(helm template release "$CHART" --values "$base" --show-only templates/management-console-ingress.yaml)
          if grep -q 'path: /api' <<< "$ingress" || grep -Eq 'name: release-ncode-identity-host$' <<< "$ingress"; then
            echo "::error::The management console Ingress routes a path to the server."
            exit 1
          fi
          # The console calls the management API at /api on its authority's origin, where the server checks its DPoP proofs.
          if ! helm template release "$CHART" --values "$base" \
            --show-only templates/management-console-deployment.yaml | grep -q 'value: "https://id.example.com/api"'; then
            echo "::error::The management console must call the management API at https://id.example.com/api."
            exit 1
          fi
          if ! helm template release "$CHART" --values "$base" --set managementConsole.authority=https://auth.example.com/ \
            --show-only templates/management-console-deployment.yaml | grep -q 'value: "https://auth.example.com/api"'; then
            echo "::error::The management console must call the management API at https://auth.example.com/api."
            exit 1
          fi
          # The console is opt-in: a release that does not enable it renders none of its objects.
          if helm template release "$CHART" --values "$CHART/ci/single-replica-values.yaml" | grep -q 'management-console'; then
            echo "::error::The chart rendered the management console without managementConsole.enabled."
            exit 1
          fi
          # Without Valkey the console never runs two replicas at once; with Valkey an update never drops below the count.
          if ! helm template release "$CHART" --values "$base" \
            --show-only templates/management-console-deployment.yaml | grep -q 'type: Recreate'; then
            echo "::error::A management console without Valkey must use the Recreate strategy."
            exit 1
          fi
          rolling=$(helm template release "$CHART" --values "$base" --set managementConsole.valkey.existingSecret=console-valkey \
            --show-only templates/management-console-deployment.yaml)
          if ! grep -q 'maxSurge: 1' <<< "$rolling" || ! grep -q 'maxUnavailable: 0' <<< "$rolling"; then
            echo "::error::A management console with Valkey must roll out with maxSurge 1 and maxUnavailable 0."
            exit 1
          fi

      - name: Refuse an unsafe management console key ring
        run: |
          base="$CHART/ci/management-console-remote-keys-values.yaml"
          key=managementConsole.keyRings.client.remoteKeys.mgmt-client
          refuse() {
            if helm template release "$CHART" --values "$base" "$@" > /dev/null 2>&1; then
              echo "::error::The chart rendered a management console key ring it must refuse: $*"
              exit 1
            fi
          }
          # Another remote key of the client key ring, with every field, under the id given.
          other() {
            local id="managementConsole.keyRings.client.remoteKeys.$1"
            echo --set "$id.provider=aws-kms" --set "$id.keyId=arn:aws:kms:us-west-2:111122223333:key/abcd" \
              --set "$id.algorithm=ES256" --set "$id.secretType=ecc" --set "$id.keySizeBits=256"
          }
          # The same key under an id of its own renders, so each refusal below is the rule it names.
          helm template release "$CHART" --values "$base" $(other mgmt-client-2) > /dev/null
          refuse --set managementConsole.keyRings.dpop.pemSecret=
          refuse --set managementConsole.keyRings.client.pemSecret=identity-mgmt-client-key
          refuse $(other MGMT-CLIENT)
          refuse $(other bad__id)
          refuse --set managementConsole.keyRings.client.remoteKeys.incomplete.provider=aws-kms
          refuse --set "$key.provider=hashicorp-vault"
          refuse --set "$key.keySizeBits=0"
          refuse --set "$key.keyId=arn:aws:kms:us-west-2:111122223333:secret/abcd"
          refuse --set "$key.provider=azure-key-vault" --set "$key.keyId=https://contoso.vault.azure.net/keys/mgmt-client"
          refuse --set "$key.provider=google-cloud-kms" --set "$key.keyId=projects/p/locations/l/keyRings/r/cryptoKeys/mgmt-client"
          refuse --set "$key.provider=azure-key-vault" \
            --set "$key.keyId=https://contoso.vault.azure.net/keys/mgmt-client/0123456789abcdef0123456789abcdef" \
            --set managementConsole.secretProtection.azureKeyVault.workloadIdentity.clientId=66666666-7777-8888-9999-000000000000
          refuse --set "$key.provider=google-cloud-kms" \
            --set "$key.keyId=projects/p/locations/l/keyRings/r/cryptoKeys/k/cryptoKeyVersions/1" \
            --set managementConsole.secretProtection.googleCloudKms.workloadIdentityFederation.provider=not-a-provider

      - name: Hold the management console's keys in a key management service
        run: |
          base="$CHART/ci/management-console-remote-keys-values.yaml"
          key=managementConsole.keyRings.client.remoteKeys.mgmt-client
          console() {
            helm template release "$CHART" --values "$base" --show-only templates/management-console-deployment.yaml "$@"
          }
          expect() {
            local rendered="$1"; shift
            for expected in "$@"; do
              if ! grep -q -- "$expected" <<< "$rendered"; then
                echo "::error::The release lacks: $expected"
                exit 1
              fi
            done
          }
          reject() {
            local rendered="$1"; shift
            for unexpected in "$@"; do
              if grep -q -- "$unexpected" <<< "$rendered"; then
                echo "::error::The release renders what it must not: $unexpected"
                exit 1
              fi
            done
          }
          aws=$(console)
          expect "$aws" 'name: Bff__KeyRings__mgmt-client__RemoteKeys__mgmt-client__KeyId' \
            'name: AWS_ROLE_ARN' \
            'name: aws-web-identity' 'name: Bff__KeyRings__mgmt-dpop__PemFiles__0'
          # A key ring without pemSecret mounts no Secret.
          # The console registers every vendor without a key-creation location, so it renders no provider section (ADR-1489).
          reject "$aws" 'Bff__KeyRings__mgmt-client__PemFiles' 'name: client-key' 'RemoteKeyProviders'
          # The server's pods never carry the console's identity.
          reject "$(helm template release "$CHART" --values "$base" --show-only templates/deployment.yaml)" 'AWS_ROLE_ARN'
          # A vendor no remote key names gets no credentials.
          azure=$(console --set "$key.provider=azure-key-vault" \
            --set "$key.keyId=https://contoso.vault.azure.net/keys/mgmt-client/0123456789abcdef0123456789abcdef" \
            --set managementConsole.secretProtection.azureKeyVault.workloadIdentity.tenantId=11111111-2222-3333-4444-555555555555 \
            --set managementConsole.secretProtection.azureKeyVault.workloadIdentity.clientId=66666666-7777-8888-9999-000000000000)
          expect "$azure" 'name: AZURE_CLIENT_ID'
          reject "$azure" 'AwsKms' 'AWS_ROLE_ARN' 'RemoteKeyProviders'
          google=$(helm template release "$CHART" --values "$base" --set "$key.provider=google-cloud-kms" \
            --set "$key.keyId=projects/my-project/locations/us-central1/keyRings/ncode-identity-console/cryptoKeys/mgmt-client/cryptoKeyVersions/1" \
            --set managementConsole.secretProtection.googleCloudKms.workloadIdentityFederation.provider=projects/123456789012/locations/global/workloadIdentityPools/ncode-identity/providers/cluster)
          expect "$google" 'name: GOOGLE_APPLICATION_CREDENTIALS' \
            'name: release-ncode-identity-host-management-console-google-cloud' 'checksum/google-cloud-credentials'
          reject "$google" 'name: release-ncode-identity-host-google-cloud$' 'AWS_ROLE_ARN' 'RemoteKeyProviders'
          # A console whose keys are all PEM Secrets carries no identity, whatever its identity values say.
          pem=$(helm template release "$CHART" --values "$CHART/ci/management-console-values.yaml" \
            --show-only templates/management-console-deployment.yaml \
            --set managementConsole.secretProtection.awsKms.webIdentity.roleArn=arn:aws:iam::111122223333:role/x)
          reject "$pem" 'AWS_ROLE_ARN' 'RemoteKeyProviders'

  # Rendering cannot prove what only a cluster does: cert-manager issuing the certificates, the controller reading the
  # annotations the chart renders, and the controller verifying the pods' certificate. This job installs the chart in a kind
  # cluster behind each supported ingress controller to prove them.
  cluster:
    name: Install the host chart in kind (${{ matrix.controller }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - controller: ingress-nginx
            class: nginx
          - controller: traefik
            class: traefik

    env:
      CHART: charts/ncode-identity-host
      NAMESPACE: identity

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the token stays out of .git/config, where later steps could read it.
          persist-credentials: false

      # A third-party action, so it is pinned to a commit; Dependabot moves the pin and its version comment together.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the host image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hosts/NCode.Identity.OpenId.Host/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ncode-identity-host:kind
          cache-from: type=gha,scope=host-image

      - name: Create the cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: identity

      - name: Load the host image into the cluster
        run: kind load docker-image ncode-identity-host:kind --name identity

      - name: Install cert-manager
        run: |
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.21.3 \
            --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m

      - name: Install the ingress controller
        run: |
          if [ "${{ matrix.controller }}" = ingress-nginx ]; then
            helm install ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx --version 4.15.1 \
              --namespace ingress-nginx --create-namespace --set controller.service.type=ClusterIP \
              --set controller.admissionWebhooks.enabled=false --wait --timeout 5m
          else
            helm install traefik traefik --repo https://traefik.github.io/charts --version 42.3.1 \
              --namespace traefik --create-namespace --set service.spec.type=ClusterIP --wait --timeout 5m
          fi

      # The release reads the database and the root key from Secrets, which are generated here and never stored.
      - name: Create the database and its Secrets
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          password=$(openssl rand -hex 16)
          kubectl -n "$NAMESPACE" create secret generic postgres --from-literal=password="$password"
          kubectl -n "$NAMESPACE" create secret generic identity-database \
            --from-literal=connection-string="Host=postgres;Port=5432;Database=openiddb;Username=postgres;Password=$password"
          kubectl -n "$NAMESPACE" create secret generic identity-root-key \
            --from-literal=key="$(head -c 32 /dev/urandom | basenc --base64url -w0 | tr -d '=')"
          kubectl -n "$NAMESPACE" apply -f "$CHART/ci/kind-postgres.yaml"
          kubectl -n "$NAMESPACE" rollout status deployment/postgres --timeout=3m

      # The chart's pre-install migration Job and the pods' readiness probes over HTTPS prove that the pods serve HTTPS.
      - name: Install the chart
        run: |
          set -euo pipefail
          helm install release "$CHART" --namespace "$NAMESPACE" --values "$CHART/ci/kind-values.yaml" \
            --set backendTls.ingressController=${{ matrix.controller }} --set ingress.className=${{ matrix.class }} \
            --wait --timeout 10m

      # through_ingress sends one request to the pods' Host through the ingress controller's Service and prints the HTTP
      # status code, or 000 when the request fails. Later steps source the file.
      - name: Verify the pods' certificate through the controller
        run: |
          set -euo pipefail
          helpers="$RUNNER_TEMP/kind-helpers.sh"
          if [ "${{ matrix.controller }}" = ingress-nginx ]; then
            controller_namespace=ingress-nginx
            controller_service=svc/ingress-nginx-controller
          else
            controller_namespace=traefik
            controller_service=svc/traefik
          fi
          printf 'CONTROLLER_NAMESPACE=%s\nCONTROLLER_SERVICE=%s\n' "$controller_namespace" "$controller_service" > "$helpers"
          cat >> "$helpers" <<'EOF'
          through_ingress() {
            local path="${1:-/health/ready}"
            local code=000
            local forward
            kubectl -n "$CONTROLLER_NAMESPACE" port-forward "$CONTROLLER_SERVICE" 8080:80 > /dev/null 2>&1 &
            forward=$!
            local attempt
            for attempt in $(seq 1 30); do
              if (exec 3<> /dev/tcp/127.0.0.1/8080) 2> /dev/null; then
                break
              fi
              sleep 1
            done
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
              -H 'Host: id.example.com' "http://127.0.0.1:8080$path" || true)
            kill "$forward" 2> /dev/null || true
            wait "$forward" 2> /dev/null || true
            printf '%s' "$code"
          }
          EOF
          source "$helpers"
          code=000
          for attempt in $(seq 1 12); do
            code=$(through_ingress /health/ready)
            if [ "$code" = 200 ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "::error::A request to /health/ready through the ${{ matrix.controller }} controller answered $code; expected 200, so the controller did not verify and reach the pods."
            exit 1
          fi

      # The controller presents the client certificate of the chart's ingress Secret, and the pods' probes need none.
      # A probe and a non-probe path are both requested through the controller.
      - name: Require the ingress controller's certificate
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kind-helpers.sh"
          helm upgrade release "$CHART" --namespace "$NAMESPACE" --values "$CHART/ci/kind-values.yaml" \
            --set backendTls.ingressController=${{ matrix.controller }} --set ingress.className=${{ matrix.class }} \
            --set backendTls.clientCertificate.required=true --wait --timeout 10m
          code=000
          for attempt in $(seq 1 12); do
            code=$(through_ingress /health/ready)
            if [ "$code" = 200 ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "::error::A request to /health/ready through the ${{ matrix.controller }} controller answered $code with the client certificate required; expected 200, so the controller did not present its certificate."
            exit 1
          fi
          code=000
          for attempt in $(seq 1 12); do
            code=$(through_ingress /.well-known/openid-configuration)
            if [ "$code" = 200 ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "::error::A request to /.well-known/openid-configuration through the ${{ matrix.controller }} controller answered $code with the client certificate required; expected 200, so the controller did not present its certificate on a path the pods do not exempt (a 403 means the pods refused the controller)."
            exit 1
          fi

      # A request that reaches the pods' Service without the ingress controller's certificate is refused, except the probes.
      - name: Refuse a request that carries no proxy certificate
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/release-ncode-identity-host 8443:443 > /dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2> /dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if (exec 3<> /dev/tcp/127.0.0.1/8443) 2> /dev/null; then
              break
            fi
            sleep 1
          done

          # direct prints the HTTP status code of a request straight to the pods, or 000 when the request fails. The
          # arguments after the path go to curl.
          direct() {
            local path="$1"
            shift
            curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 --insecure \
              -H 'Host: id.example.com' "$@" "https://127.0.0.1:8443$path" || true
          }

          # expect_direct requires the expected status code within 12 attempts five seconds apart.
          expect_direct() {
            local expected="$1"
            local path="$2"
            local description="$3"
            shift 3
            local code=000
            local attempt
            for attempt in $(seq 1 12); do
              code=$(direct "$path" "$@")
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$description answered $code; expected $expected."
            exit 1
          }

          expect_direct 200 /health/live 'A request to /health/live without a certificate'
          expect_direct 403 / 'A request to / without a certificate'
          expect_direct 403 /.well-known/openid-configuration 'A request to the discovery document without a certificate'

          kubectl -n "$NAMESPACE" get secret release-ncode-identity-host-ingress -o jsonpath='{.data.tls\.crt}' | base64 -d > "$RUNNER_TEMP/proxy.crt"
          kubectl -n "$NAMESPACE" get secret release-ncode-identity-host-ingress -o jsonpath='{.data.tls\.key}' | base64 -d > "$RUNNER_TEMP/proxy.key"
          expect_direct 200 /.well-known/openid-configuration 'A request to the discovery document with the certificate of the ingress Secret' \
            --cert "$RUNNER_TEMP/proxy.crt" --key "$RUNNER_TEMP/proxy.key"

      # A controller that verifies against a CA that did not sign the pods' certificate must not reach them.
      # The Secret holds a certificate and key as well as the CA, so Traefik loads the ServersTransport and the 502 comes from the failed verification.
      - name: Refuse a controller that verifies against the wrong CA
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kind-helpers.sh"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -subj /CN=wrong-ca -days 1 \
            -keyout "$RUNNER_TEMP/wrong-ca.key" -out "$RUNNER_TEMP/wrong-ca.pem"
          kubectl -n "$NAMESPACE" create secret generic wrong-ca --from-file=ca.crt="$RUNNER_TEMP/wrong-ca.pem" \
            --from-file=tls.crt="$RUNNER_TEMP/wrong-ca.pem" --from-file=tls.key="$RUNNER_TEMP/wrong-ca.key"
          helm upgrade release "$CHART" --namespace "$NAMESPACE" --values "$CHART/ci/kind-values.yaml" \
            --set backendTls.ingressController=${{ matrix.controller }} --set ingress.className=${{ matrix.class }} \
            --set backendTls.clientCertificate.required=true --set backendTls.ingressSecret=wrong-ca --wait --timeout 10m
          code=000
          for attempt in $(seq 1 12); do
            code=$(through_ingress /health/ready)
            if [ "$code" = 502 ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != 502 ]; then
            echo "::error::A request to /health/ready through the ${{ matrix.controller }} controller answered $code with a foreign CA in its verification Secret; expected 502, so the controller did not verify the pods' certificate."
            exit 1
          fi

      - name: Show the cluster when a step fails
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get certificates -A || true
          kubectl get issuers -A || true
          kubectl get ingress -A || true
          kubectl get serverstransports.traefik.io -A || true
          kubectl -n "$NAMESPACE" describe pods || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/component=server --tail=200 || true
          kubectl -n "$NAMESPACE" logs --all-containers --tail=200 -l app.kubernetes.io/component=migrations || true
          kubectl -n "${{ matrix.controller }}" logs --all-containers --tail=200 -l app.kubernetes.io/name="${{ matrix.controller }}" || true
