# Host image — builds the production image of NCode.Identity.OpenId.Host for every published architecture.
#
# The image is the deployable artifact (ADR-0133), so a change that breaks its build — a project the publish needs, a
# frontend build step, the allow-list .dockerignore — fails here rather than at release. Nothing is pushed: publishing
# to GHCR belongs to the release workflow. Every stage that runs commands runs on the runner's own architecture and
# cross-publishes, so the arm64 image builds without emulation (ADR-0178).
name: Host image

on:
  # A push gates only main, because a pull request already gates every other branch (see ci.yml).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# See the note in ci.yml: on main the group includes the SHA so every trunk commit keeps its own verdict.
concurrency:
  group: host-image-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build host image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Node major is pinned once, in src/frontend/.node-version (ADR-0152); the Dockerfile takes it as a build
      # argument because a FROM line cannot read a file.
      - name: Read the Node major
        id: node
        run: echo "version=$(cat src/frontend/.node-version)" >> "$GITHUB_OUTPUT"

      # Third-party actions, so each is pinned to a commit; Dependabot moves the pin and its version comment together.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/NCode.Identity.OpenId.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
