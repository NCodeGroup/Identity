# Publish artifacts - publishes the host image, the management console image and the host chart to GHCR (issue #773, ADR-1503).
#
# Every push to main (and a manual run on main) publishes three artifacts at one unique prerelease version: the host
# image, the management console image and the host chart. The version comes from build/artifact-version.ps1:
# `<version.json prerelease>.<first-parent commit count>`, for example 0.0.1-alpha.57.
#
# The signing identity of every signature and attestation is this workflow on main:
# https://github.com/NCodeGroup/identity/.github/workflows/publish-artifacts.yml@refs/heads/main
#
# Package visibility and the Actions access of a package are owner settings in GitHub that no workflow can change; see
# the chart README, section "Published artifacts".
name: Publish artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a second waits rather than racing the first to the registry.
concurrency:
  group: publish-artifacts
  cancel-in-progress: false

jobs:
  version:
    name: Compute the version
    if: github.repository == 'NCodeGroup/identity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version height counts the commit history, which a shallow clone truncates.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the version
        id: version
        shell: pwsh
        run: |
          $version = ./build/artifact-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT
          "Publishing **$version**." >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Publish
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      host-digest: ${{ steps.host.outputs.digest }}
      console-digest: ${{ steps.console.outputs.digest }}
      chart-digest: ${{ steps.chart.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The caches are read-only here: they are the ones host-image.yml and console-image.yml write.
      - name: Publish the host image
        id: host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hosts/NCode.Identity.OpenId.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ncodegroup/ncode-identity-host:${{ env.VERSION }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=host-image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=ncode-identity-host

      - name: Publish the management console image
        id: console
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hosts/NCode.Identity.ManagementConsole.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ncodegroup/ncode-identity-management-console:${{ env.VERSION }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=console-image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=ncode-identity-management-console
