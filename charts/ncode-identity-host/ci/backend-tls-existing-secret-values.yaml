# A release whose pods serve a certificate from Secrets the operator created, for the server and the console, behind ingress-nginx.
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
  # Names this release's keys, so a render that sets a remote key provider on top of these values passes the
  # deployment check; with no provider set, nothing uses it.
  remoteKeys:
    deployment: ci-single-replica
backendTls:
  existingSecret: identity-tls
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
managementConsole:
  enabled: true
  host: manage.example.com
  keyRings:
    client:
      pemSecret: identity-mgmt-client-key
    dpop:
      pemSecret: identity-mgmt-dpop-key
  backendTls:
    existingSecret: identity-console-tls
