# A production release for a kind cluster. The host and management console images are built from the repository and
# loaded into the cluster's nodes, so they are never pulled. Traefik routes to the pods through the release's
# ServersTransport, and the console serves manage.example.com. The workflow creates the database, root key and console
# key Secrets this release names.
image:
  repository: ncode-identity-host
  tag: kind
  pullPolicy: Never
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  parts:
    existingSecret: postgres-app
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    disabled: true
  # Names this release's keys; with no remote key provider enabled, nothing uses it.
  remoteKeys:
    deployment: ci-kind
ingress:
  enabled: true
  controller: traefik
  className: traefik
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
managementConsole:
  enabled: true
  host: manage.example.com
  image:
    repository: ncode-identity-management-console
    tag: kind
    pullPolicy: Never
  keyRings:
    client:
      pemSecret: identity-mgmt-client-key
    dpop:
      pemSecret: identity-mgmt-dpop-key
  ingress:
    enabled: true
    className: traefik
