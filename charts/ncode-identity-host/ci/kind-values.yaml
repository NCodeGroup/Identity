# A production release for a kind cluster. The image is built from the repository and loaded into the cluster's nodes,
# so it is never pulled. Traefik routes to the pods through the release's ServersTransport; the workflow creates the
# database and root key Secrets this release names.
image:
  repository: ncode-identity-host
  tag: kind
  pullPolicy: Never
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  parts:
    existingSecret: postgres-app
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    disabled: true
  # Names this release's keys; with no remote key provider enabled, nothing uses it.
  remoteKeys:
    deployment: ci-kind
ingress:
  enabled: true
  controller: traefik
  className: traefik
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
