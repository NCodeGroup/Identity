# A production release with the management console on its own host, which routes /api to the server.
allowedHosts:
  - id.example.com
  - manage.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: id.example.com
      paths:
        - path: /
          pathType: Prefix
managementConsole:
  enabled: true
  host: manage.example.com
  keys:
    clientKeySecret: identity-mgmt-client-key
    dpopKeySecret: identity-mgmt-dpop-key
  ingress:
    enabled: true
    className: traefik
    tls:
      - secretName: manage-example-com-tls
        hosts:
          - manage.example.com
