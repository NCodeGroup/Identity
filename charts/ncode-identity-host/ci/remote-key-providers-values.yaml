# A production release whose root key is a local key, and whose tenants may hold their signing and encryption keys in
# AWS KMS, Azure Key Vault or Google Cloud KMS, which the host reaches through web identity, workload identity and
# workload identity federation.
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  awsKms:
    webIdentity:
      roleArn: arn:aws:iam::111122223333:role/ncode-identity-remote-keys
  azureKeyVault:
    workloadIdentity:
      tenantId: 11111111-2222-3333-4444-555555555555
      clientId: 66666666-7777-8888-9999-000000000000
  googleCloudKms:
    workloadIdentityFederation:
      provider: projects/123456789012/locations/global/workloadIdentityPools/ncode-identity/providers/cluster
  remoteKeyProviders:
    awsKms:
      region: us-west-2
    azureKeyVault:
      vaultUri: https://contoso.vault.azure.net
    googleCloudKms:
      keyRing: projects/my-project/locations/us-central1/keyRings/ncode-identity-tenant-keys
  remoteKeys:
    deployment: contoso-prod
  recovery:
    publicKeyConfigMap: identity-recovery-key
