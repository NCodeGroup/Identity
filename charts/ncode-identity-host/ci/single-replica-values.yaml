# The smallest production release: one replica, no Valkey.
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  recovery:
    publicKeyConfigMap: identity-recovery-key
  # Names this release's keys, so a render that sets a remote key provider on top of these values passes the
  # deployment check; with no provider set, nothing uses it.
  remoteKeys:
    deployment: ci-single-replica
