# A production release whose root key is a local key, and whose tenants may bring a root key from AWS KMS or Google Cloud
# KMS, which the host reaches through web identity and workload identity federation.
allowedHosts:
  - id.example.com
tenantResolution:
  staticSingle:
    issuer: https://id.example.com
database:
  existingSecret: identity-database
secretProtection:
  rootKeyProvider: local
  local:
    keySecret: identity-root-key
  awsKms:
    webIdentity:
      roleArn: arn:aws:iam::111122223333:role/ncode-identity-tenant-root-keys
  googleCloudKms:
    workloadIdentityFederation:
      provider: projects/123456789012/locations/global/workloadIdentityPools/ncode-identity/providers/cluster
      serviceAccountEmail: ncode-identity@my-project.iam.gserviceaccount.com
  ownerRootKeys:
    providers:
      - aws-kms
      - google-cloud-kms
  recovery:
    publicKeyConfigMap: identity-recovery-key
