# The two Flux Kustomizations that deploy the host chart: the prerequisites first, then the release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  path: ./identity/prerequisites
  # Key material is never pruned: removing a manifest from Git leaves its object in the cluster.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 10m
  path: ./identity/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-prerequisites
