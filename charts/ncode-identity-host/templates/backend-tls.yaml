{{- $fullname := include "identity-host.fullname" . }}
{{- $labels := include "identity-host.labels" . }}
{{- $consoleNeedsCertificate := and .Values.managementConsole.enabled (not .Values.managementConsole.backendTls.existingSecret) }}
{{- if and (not .Values.backendTls.certManager.issuerRef.name) (or (not .Values.backendTls.existingSecret) $consoleNeedsCertificate) }}
# The release's private CA: a self-signed Issuer signs the CA Certificate, and the CA Issuer built from it signs the
# pods' certificates, which the ingress controller verifies against the CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  labels:
    {{- $labels | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-ca
  labels:
    {{- $labels | nindent 4 }}
spec:
  isCA: true
  commonName: ncode-identity-ca
  secretName: {{ $fullname }}-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
  issuerRef:
    name: {{ $fullname }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-ca
  labels:
    {{- $labels | nindent 4 }}
spec:
  ca:
    secretName: {{ $fullname }}-ca
{{- if not .Values.backendTls.existingSecret }}
---
{{- end }}
{{- end }}
{{- if not .Values.backendTls.existingSecret }}
{{ include "identity-host.backendTls.certificate" (dict "root" . "name" (include "identity-host.backendTls.secretName" .) "secretName" (include "identity-host.backendTls.secretName" .) "service" $fullname "extra" .Values.backendTls.certManager.dnsNames "labels" $labels) }}
{{- end }}
