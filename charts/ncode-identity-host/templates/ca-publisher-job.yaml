{{- if .Values.backendTls.caPublisher.enabled }}
{{- $name := printf "%s-ca-publisher" (include "identity-host.fullname" .) }}
{{- $publisher := .Values.backendTls.caPublisher }}
# Publishes the ca.crt of the chart's private CA to the CA ConfigMap after install and upgrade. The kubelet holds the pod
# until cert-manager has created the CA Secret, and `kubectl apply -k` creates or updates the ConfigMap in one call, so
# the routes never lack a CA. The pod mounts only the ca.crt key, never the CA's private key.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "identity-host.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: ca-publisher
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    # A failed Job stays for its logs until the next release replaces it.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ $publisher.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "identity-host.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: ca-publisher
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with include "identity-host.imagePullSecrets" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      # The kubectl image's default user is root, so the pod names the unprivileged user it runs as.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          {{- if $publisher.image.digest }}
          image: {{ printf "%s@%s" $publisher.image.repository $publisher.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $publisher.image.repository $publisher.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ $publisher.image.pullPolicy }}
          args:
            - apply
            - -k
            - /work
          env:
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "identity-host.containerSecurityContext" . | nindent 12 }}
          {{- with $publisher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          projected:
            sources:
              - configMap:
                  name: {{ $name }}
                  items:
                    - key: kustomization.yaml
                      path: kustomization.yaml
              - secret:
                  name: {{ include "identity-host.fullname" . }}-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with include "identity-host.scheduling" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
{{- end }}
