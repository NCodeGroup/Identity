{{- include "identity-host.validate" . }}
{{- include "identity-host.backendTls.validate" . }}
{{- $valkey := include "identity-host.valkeyEnabled" . }}
{{- $googleCloudCredentials := include "identity-host.kmsCredentials.googleCloudCredentialConfiguration" (include "identity-host.kmsCredentials.server" . | fromYaml) }}
{{- $probeHost := include "identity-host.probeHost" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity-host.fullname" . }}
  labels:
    {{- include "identity-host.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    {{- if $valkey }}
    # A new replica is ready before an old one stops, so the release never drops below its replica count.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # Without Valkey each replica holds single-use state in process, so two replicas must never run at once, not even
    # during an update. Recreate waits until the old pod has terminated; a rolling update with maxSurge 0 starts the new
    # pod as soon as the old one begins terminating, while it may still be serving.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "identity-host.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity-host.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations $googleCloudCredentials }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $googleCloudCredentials }}
        # A changed configuration restarts the pods, which read it only at start.
        checksum/google-cloud-credentials: {{ sha256sum $googleCloudCredentials | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "identity-host.serviceAccountName" . }}
      # The host never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with include "identity-host.imagePullSecrets" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # The restricted Pod Security Standard: the image's non-root 'app' user, whose group can read the mounted keys.
      securityContext:
        {{- include "identity-host.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "identity-host.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: host
          image: {{ include "identity-host.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "identity-host.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            {{- include "identity-host.hostEnv" . | trim | nindent 12 }}
            {{- include "identity-host.backendTls.env" . | nindent 12 }}
            {{- if .Values.setup.token.existingSecret }}
            - name: Setup__Token
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.setup.token.existingSecret }}
                  key: {{ .Values.setup.token.key | quote }}
            {{- end }}
            {{- if .Values.managementConsole.enabled }}
            - name: Setup__Wizard__ManagementConsole__BaseUrl
              value: {{ printf "https://%s" .Values.managementConsole.host | quote }}
            - name: Setup__Wizard__ManagementConsole__ClientId
              value: {{ .Values.setup.managementConsole.clientId | quote }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The kubelet sends the pod's IP as the Host header, which AllowedHosts rejects, so each probe names an allowed
          # host.
          startupProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          lifecycle:
            # The image has no shell, so the drain uses the kubelet's sleep action rather than 'sleep' in the container.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "identity-host.hostVolumeMounts" . | trim | nindent 12 }}
            - name: backend-tls
              mountPath: /etc/ncode-identity/tls
              readOnly: true
      volumes:
        {{- include "identity-host.hostVolumes" . | trim | nindent 8 }}
        - name: backend-tls
          secret:
            secretName: {{ include "identity-host.backendTls.secretName" . }}
            defaultMode: 0440
      {{- with include "identity-host.scheduling" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
