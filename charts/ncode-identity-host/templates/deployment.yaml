{{- include "identity-host.validate" . }}
{{- $valkey := include "identity-host.valkeyEnabled" . }}
{{- $keyProtectionRoot := "/etc/ncode-identity/key-protection" }}
{{- $probeHost := include "identity-host.probeHost" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity-host.fullname" . }}
  labels:
    {{- include "identity-host.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    {{- if $valkey }}
    # A new replica is ready before an old one stops, so the release never drops below its replica count.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # Without Valkey each replica holds single-use state in process, so two replicas must never run at once, not even
    # during an update. Recreate waits until the old pod has terminated; a rolling update with maxSurge 0 starts the new
    # pod as soon as the old one begins terminating, while it may still be serving.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "identity-host.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity-host.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "identity-host.serviceAccountName" . }}
      # The host never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # The restricted Pod Security Standard: the image's non-root 'app' user, whose group can read the mounted keys.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "identity-host.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: host
          image: {{ include "identity-host.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: AllowedHosts
              value: {{ join ";" .Values.allowedHosts | quote }}
            # Every tenant is provisioned with persisted signing keys.
            - name: DeveloperKeys__Mode
              value: "None"
            - name: OpenId__TenantResolution__StrategyCode
              value: {{ .Values.tenantResolution.strategyCode | quote }}
            {{- with .Values.tenantResolution.staticSingle.issuer }}
            - name: OpenId__TenantResolution__StaticSingle__Issuer
              value: {{ . | quote }}
            {{- end }}
            {{- range $index, $network := .Values.reverseProxy.knownNetworks }}
            - name: ReverseProxy__KnownNetworks__{{ $index }}
              value: {{ $network | quote }}
            {{- end }}
            {{- range $index, $proxy := .Values.reverseProxy.knownProxies }}
            - name: ReverseProxy__KnownProxies__{{ $index }}
              value: {{ $proxy | quote }}
            {{- end }}
            - name: ReverseProxy__ForwardLimit
              value: {{ .Values.reverseProxy.forwardLimit | quote }}
            - name: ConnectionStrings__openiddb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.connectionStringKey }}
            {{- if $valkey }}
            - name: ConnectionStrings__valkey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret }}
                  key: {{ .Values.valkey.connectionStringKey }}
            {{- end }}
            {{- if .Values.keyProtection.certificateSecret }}
            - name: DataProtection__KeyProtection__Certificate__CertificatePath
              value: {{ printf "%s/current/tls.crt" $keyProtectionRoot }}
            - name: DataProtection__KeyProtection__Certificate__PrivateKeyPath
              value: {{ printf "%s/current/tls.key" $keyProtectionRoot }}
            {{- end }}
            {{- range $index, $secret := .Values.keyProtection.previousCertificateSecrets }}
            - name: DataProtection__KeyProtection__PreviousCertificates__{{ $index }}__CertificatePath
              value: {{ printf "%s/previous-%d/tls.crt" $keyProtectionRoot $index }}
            - name: DataProtection__KeyProtection__PreviousCertificates__{{ $index }}__PrivateKeyPath
              value: {{ printf "%s/previous-%d/tls.key" $keyProtectionRoot $index }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The kubelet sends the pod's IP as the Host header, which AllowedHosts rejects, so each probe names an allowed
          # host.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          lifecycle:
            # The image has no shell, so the drain uses the kubelet's sleep action rather than 'sleep' in the container.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The root filesystem is read-only; the runtime's diagnostics socket and temporary files go here.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.keyProtection.certificateSecret }}
            - name: key-protection-current
              mountPath: {{ printf "%s/current" $keyProtectionRoot }}
              readOnly: true
            {{- end }}
            {{- range $index, $secret := .Values.keyProtection.previousCertificateSecrets }}
            - name: key-protection-previous-{{ $index }}
              mountPath: {{ printf "%s/previous-%d" $keyProtectionRoot $index }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- with .Values.keyProtection.certificateSecret }}
        - name: key-protection-current
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
        {{- range $index, $secret := .Values.keyProtection.previousCertificateSecrets }}
        - name: key-protection-previous-{{ $index }}
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
