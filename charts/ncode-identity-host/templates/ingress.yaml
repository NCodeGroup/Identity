{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity-host.fullname" . }}
  labels:
    {{- include "identity-host.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- if eq .Values.backendTls.ingressController "ingress-nginx" }}
  {{- $annotations = merge $annotations (include "identity-host.backendTls.ingressNginxAnnotations" (dict "root" . "service" (include "identity-host.fullname" .) "secretName" (include "identity-host.backendTls.secretName" .)) | fromYaml) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "identity-host.fullname" $ }}
                port:
                  name: https
          {{- end }}
    {{- end }}
{{- end }}
