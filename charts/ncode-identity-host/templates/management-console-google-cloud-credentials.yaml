{{- if .Values.managementConsole.enabled }}
{{- with include "identity-host.kmsCredentials.googleCloudCredentialConfiguration" (include "identity-host.kmsCredentials.managementConsole" . | fromYaml) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity-host.managementConsole.fullname" $ }}-google-cloud
  labels:
    {{- include "identity-host.managementConsole.labels" $ | nindent 4 }}
data:
  credential-configuration.json: |
    {{- . | nindent 4 }}
{{- end }}
{{- end }}
