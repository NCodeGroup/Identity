{{- if and .Values.managementConsole.enabled .Values.managementConsole.ingress.enabled }}
# Every path reaches the console; the console calls the management API at its authority's origin (ADR-1488).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity-host.managementConsole.fullname" . }}
  labels:
    {{- include "identity-host.managementConsole.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.managementConsole.ingress.annotations }}
  {{- if eq .Values.backendTls.ingressController "ingress-nginx" }}
  {{- $annotations = merge $annotations (include "identity-host.backendTls.ingressNginxAnnotations" (dict "root" . "service" (include "identity-host.managementConsole.fullname" .) "secretName" (include "identity-host.managementConsole.backendTls.secretName" .)) | fromYaml) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.managementConsole.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.managementConsole.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.managementConsole.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "identity-host.managementConsole.fullname" . }}
                port:
                  name: https
{{- end }}
