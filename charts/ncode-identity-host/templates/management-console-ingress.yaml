{{- if and .Values.managementConsole.enabled .Values.managementConsole.ingress.enabled }}
# /api reaches the server for machine callers and every other path reaches the console (ADR-1437).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity-host.managementConsole.fullname" . }}
  labels:
    {{- include "identity-host.managementConsole.labels" . | nindent 4 }}
  {{- with .Values.managementConsole.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.managementConsole.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.managementConsole.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.managementConsole.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "identity-host.fullname" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "identity-host.managementConsole.fullname" . }}
                port:
                  name: http
{{- end }}
