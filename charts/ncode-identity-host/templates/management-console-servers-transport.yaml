{{- if and .Values.managementConsole.enabled .Values.managementConsole.ingress.enabled (eq .Values.backendTls.ingressController "traefik") }}
# Traefik verifies the console pods' certificate against the CA in the verification Secret, under the Service's DNS name.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "identity-host.managementConsole.fullname" . }}
  labels:
    {{- include "identity-host.managementConsole.labels" . | nindent 4 }}
spec:
  serverName: {{ include "identity-host.backendTls.serverName" (dict "root" . "service" (include "identity-host.managementConsole.fullname" .)) | quote }}
  rootCAsSecrets:
    - {{ include "identity-host.backendTls.verificationSecretName" (dict "root" . "service" (include "identity-host.managementConsole.fullname" .)) }}
{{- end }}
