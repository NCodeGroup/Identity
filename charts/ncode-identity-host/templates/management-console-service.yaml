{{- if .Values.managementConsole.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "identity-host.managementConsole.fullname" . }}
  labels:
    {{- include "identity-host.managementConsole.labels" . | nindent 4 }}
  {{- if eq .Values.backendTls.ingressController "traefik" }}
  annotations:
    {{- include "identity-host.backendTls.traefikServiceAnnotations" (dict "root" . "name" (include "identity-host.managementConsole.fullname" .)) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.managementConsole.service.type }}
  ports:
    - name: https
      port: {{ .Values.managementConsole.service.port }}
      targetPort: https
      protocol: TCP
      appProtocol: https
  selector:
    {{- include "identity-host.managementConsole.selectorLabels" . | nindent 4 }}
{{- end }}
