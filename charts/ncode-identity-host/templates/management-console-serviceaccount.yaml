{{- if and .Values.managementConsole.enabled .Values.managementConsole.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "identity-host.managementConsole.serviceAccountName" . }}
  labels:
    {{- include "identity-host.managementConsole.labels" . | nindent 4 }}
  {{- with .Values.managementConsole.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
