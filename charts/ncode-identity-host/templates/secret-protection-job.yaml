{{- if .Values.secretProtection.rewrapJob.enabled }}
{{- include "identity-host.validate" . }}
{{- $job := .Values.secretProtection.rewrapJob }}
{{- $recoveryPrivateRoot := "/etc/ncode-identity/secret-protection/recovery-private" }}
# Runs the host image's offline secret-protection command once for this release revision: it rewraps every master key
# under the configured root key provider and recovery public key (ADR-1408). Disable the Job and delete the recovery
# private key Secret once it has completed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity-host.secretProtectionJobName" . }}
  labels:
    {{- include "identity-host.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: secret-protection
spec:
  backoffLimit: {{ $job.backoffLimit }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "identity-host.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-protection
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      # The Job runs as the host does, so a root key provider that trusts the service account (a web identity) works.
      serviceAccountName: {{ include "identity-host.serviceAccountName" . }}
      # The host never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with include "identity-host.imagePullSecrets" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "identity-host.podSecurityContext" . | nindent 8 }}
      containers:
        - name: secret-protection
          image: {{ include "identity-host.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "identity-host.containerSecurityContext" . | nindent 12 }}
          # The image's entry point starts the host; these arguments select its offline command instead.
          args:
            - secret-protection
            - {{ $job.command | quote }}
            {{- with $job.owner }}
            - --owner
            - {{ . | quote }}
            {{- end }}
            {{- if $job.dryRun }}
            - --dry-run
            {{- end }}
            {{- if $job.recoveryPrivateKeySecret }}
            - --recovery-private-key
            - {{ printf "%s/recovery-private.pem" $recoveryPrivateRoot | quote }}
            {{- end }}
          env:
            {{- include "identity-host.hostEnv" . | trim | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "identity-host.hostVolumeMounts" . | trim | nindent 12 }}
            {{- if $job.recoveryPrivateKeySecret }}
            # The recovery private key is mounted into this Job only, never into the pods that serve.
            - name: secret-protection-recovery-private
              mountPath: {{ $recoveryPrivateRoot }}
              readOnly: true
            {{- end }}
      volumes:
        {{- include "identity-host.hostVolumes" . | trim | nindent 8 }}
        {{- with $job.recoveryPrivateKeySecret }}
        - name: secret-protection-recovery-private
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
      {{- with include "identity-host.scheduling" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
{{- end }}
