{{- if and .Values.ingress.enabled (eq .Values.backendTls.ingressController "traefik") }}
# Traefik verifies the pods' certificate against the CA in the serving Secret, under the Service's DNS name.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "identity-host.fullname" . }}
  labels:
    {{- include "identity-host.labels" . | nindent 4 }}
spec:
  serverName: {{ include "identity-host.backendTls.serverName" (dict "root" . "service" (include "identity-host.fullname" .)) | quote }}
  rootCAsSecrets:
    - {{ include "identity-host.backendTls.secretName" . }}
{{- end }}
