{{- if and .Values.ingress.enabled (eq .Values.ingress.controller "traefik") }}
# Traefik verifies the pods' certificate against the CA ConfigMap or, without one, the serving Secret, under the Service's DNS name.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "identity-host.fullname" . }}
  labels:
    {{- include "identity-host.labels" . | nindent 4 }}
spec:
  serverName: {{ include "identity-host.backendTls.serverName" (dict "root" . "service" (include "identity-host.fullname" .)) | quote }}
  rootCAs:
    - {{- include "identity-host.backendTls.traefikRootCA" (dict "root" . "service" (include "identity-host.fullname" .)) | trim | nindent 6 }}
{{- end }}
