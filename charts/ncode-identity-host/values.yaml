# Default values for the ncode-identity-host chart (ADR-1458). Secrets are never values: the chart references Secrets
# the operator creates, by name.

# The number of replicas. More than one requires Valkey (ADR-1164), because replicas share single-use state through it.
replicaCount: 1

image:
  repository: ghcr.io/ncodegroup/ncode-identity-host
  # Defaults to the chart's appVersion.
  tag: ""
  # When set, the image is pulled by digest and the tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ASPNETCORE_ENVIRONMENT. Production turns on the host's production-safety gate.
environment: Production

# The host names the host answers to (AllowedHosts). Required; '*' is refused.
allowedHosts: []

tenantResolution:
  # OpenId:TenantResolution:StrategyCode. Settings for another strategy go in extraEnv.
  strategyCode: StaticSingle
  staticSingle:
    # The public issuer URL, for example https://id.example.com. Required by the StaticSingle strategy.
    issuer: ""

# The proxies whose X-Forwarded-* headers the host trusts (ForwardedHeaders). Set knownNetworks to the pod CIDR when the
# ingress controller runs in the cluster.
forwardedHeaders:
  knownNetworks: []
  knownProxies: []
  forwardLimit: 1

# The OpenAPI document (/openapi/v1.json) and the Scalar API reference page (/scalar/v1), served anonymously when
# enabled. The page requires the document. See "API reference" in the chart's README.
apiReference:
  documentEnabled: false
  pageEnabled: false

# The Postgres database (ConnectionStrings:openiddb). It also persists the Data Protection key ring. Required: name
# either existingSecret, a Secret holding the finished Npgsql connection string, or parts.existingSecret, a Secret
# holding the connection's parts, as a Postgres operator writes it; never both.
database:
  existingSecret: ""
  connectionStringKey: connection-string
  # The defaults are the keys of a CloudNativePG <cluster>-app Secret. An empty portKey leaves the port out.
  parts:
    existingSecret: ""
    hostKey: host
    portKey: port
    databaseKey: dbname
    usernameKey: user
    passwordKey: password

# The pre-install and pre-upgrade Job that applies the database migrations before the rollout (ADR-1180). Every
# migration must stay compatible with the previous release, which keeps serving until the rollout finishes.
migrations:
  enabled: true
  # A connection allowed to change the schema. Defaults to the database Secret; name a separate one so the running host
  # connects without schema rights.
  database:
    existingSecret: ""
    connectionStringKey: ""
    # Used when its existingSecret or parts.existingSecret is set, else the migration Job uses database. An empty key
    # falls back to database.parts.
    parts:
      existingSecret: ""
      hostKey: ""
      portKey: ""
      databaseKey: ""
      usernameKey: ""
      passwordKey: ""
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Valkey (ConnectionStrings:valkey), shared by every replica. Required when replicaCount is greater than 1: name either
# existingSecret, a Secret holding the finished connection string, or parts.existingSecret, a Secret holding the
# server's address and password, as a Valkey operator writes it; never both.
valkey:
  existingSecret: ""
  connectionStringKey: connection-string
  # The keys of the Secret. An empty portKey leaves the port at 6379, an empty usernameKey and an empty passwordKey
  # leave them out, and ssl connects over TLS.
  parts:
    existingSecret: ""
    hostKey: host
    portKey: port
    usernameKey: ""
    passwordKey: password
    ssl: false

# Stored secrets and the Data Protection key ring are encrypted under a root key held outside the database; see "Secret
# protection" in the chart's README.
secretProtection:
  # Required: local, aws-kms, azure-key-vault or google-cloud-kms once its values are set; ephemeral only outside Production.
  rootKeyProvider: ""
  local:
    # Secret holding the root key under the key 'key' (base64url, 32 bytes).
    keySecret: ""
    # Secrets of older root keys, kept so the master keys they wrapped still unwrap.
    previousKeySecrets: []
  awsKms:
    # ARN of the KMS key, or of an alias that names it: arn:aws:kms:<region>:<account>:alias/<name>.
    keyArn: ""
    webIdentity:
      # IAM role the host's service account assumes through the cluster's IAM OIDC identity provider.
      roleArn: ""
      audience: sts.amazonaws.com
      tokenExpirationSeconds: 3600
  azureKeyVault:
    # Identifier of the RSA key in Key Vault or Managed HSM: https://<vault>.vault.azure.net/keys/<name>.
    keyId: ""
    workloadIdentity:
      # Entra tenant of the identity whose federated credential trusts the host's service account.
      tenantId: ""
      # Client ID of the identity whose federated credential trusts the host's service account.
      clientId: ""
      audience: api://AzureADTokenExchange
      tokenExpirationSeconds: 3600
  googleCloudKms:
    # Resource name of the crypto key: projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>.
    keyName: ""
    workloadIdentityFederation:
      # Workload identity pool provider:
      # projects/<project number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>.
      provider: ""
      # Service account to impersonate; empty when the key grants its role to the federated principal.
      serviceAccountEmail: ""
      tokenExpirationSeconds: 3600
  recovery:
    # ConfigMap holding the recovery public key under the key 'recovery-public.pem'.
    publicKeyConfigMap: ""
    # true only to accept that losing the root key loses every stored secret.
    disabled: false
  # Root keys that tenants bring (SecretProtection:OwnerRootKeys). Tune the validation intervals through extraEnv.
  ownerRootKeys:
    # The key wrappers a tenant may choose for its root key: aws-kms, azure-key-vault, google-cloud-kms. Empty means no
    # tenant can bring a key. Each listed provider's workload credentials (awsKms.webIdentity,
    # azureKeyVault.workloadIdentity, googleCloudKms.workloadIdentityFederation) are mounted into the pods, so the host
    # can reach the tenant's key with the deployment's own identity.
    providers: []
  # The key management services that hold tenants' keys (SecretProtection:RemoteKeyProviders). An enabled provider is
  # registered, and the pods then carry its workload credentials (awsKms.webIdentity, azureKeyVault.workloadIdentity,
  # googleCloudKms.workloadIdentityFederation). Its location (region, vaultUri, keyRing) is where it creates keys, which
  # the tenant setting tenant_key_provider then selects; without one it binds keys a service already holds and creates
  # none (ADR-1474, ADR-1485).
  remoteKeyProviders:
    awsKms:
      # true registers the provider; a location set while it is false is refused.
      enabled: false
      # AWS region in which keys are created; empty creates no keys.
      region: ""
      # Days a deleted key waits before AWS destroys it, 7 to 30.
      pendingWindowInDays: 30
    azureKeyVault:
      # true registers the provider; a location set while it is false is refused.
      enabled: false
      # Vault in which keys are created, such as https://<vault>.vault.azure.net; empty creates no keys.
      vaultUri: ""
      # false creates software-protected keys.
      hardwareProtected: true
    googleCloudKms:
      # true registers the provider; a location set while it is false is refused.
      enabled: false
      # Key ring in which keys are created, projects/<project>/locations/<location>/keyRings/<ring>; empty creates no
      # keys.
      keyRing: ""
      # false creates software-protected keys.
      hardwareProtected: true
  # The keys the host creates in those services (SecretProtection:RemoteKeys) and the sweep that destroys the ones no
  # stored secret names.
  remoteKeys:
    # Names this release's keys in a shared KMS scope (an AWS account, a vault or a key ring): lowercase letters, digits
    # and hyphens, at most 40 characters. Required when an enabled remote key provider has its location, because it then
    # creates keys. The sweep destroys only keys tagged with it. A deployment is one database of stored secrets: every
    # replica and release that shares the database uses its name, and no other deployment in the same AWS account, vault
    # or key ring uses it, because each deployment destroys every key of its name that its own database does not name.
    deployment: ""
    # Whether the background sweep destroys orphaned keys. It runs only when deployment is set.
    sweepEnabled: true
    # How often the sweep runs, as a time span.
    sweepInterval: "1.00:00:00"
    # How old a key must be before the sweep may destroy it, as a time span between one hour and 365 days.
    sweepGracePeriod: "1.00:00:00"
  # A one-off Job from the host image that rewraps every master key under the configured root key provider and
  # recovery public key (ADR-1408). Enable it for a release that changes the root key provider, the root key or the
  # recovery key pair, and disable it again once it has completed.
  rewrapJob:
    enabled: false
    # 'rewrap' wraps every master key under the root key provider and the recovery public key; 'rewrap-recovery'
    # replaces only the recovery copies and needs recovery.publicKeyConfigMap.
    command: rewrap
    # Limits the run to one owner, such as tenant:acme or platform:platform; empty rewraps every owner.
    owner: ""
    # true only verifies that every master key can be unwrapped, and writes nothing.
    dryRun: false
    # Secret holding the recovery private key under the key 'recovery-private.pem'. It is mounted into this Job only.
    # Set it when the master keys must be unwrapped from their recovery copies, because the root key is lost.
    recoveryPrivateKeySecret: ""
    backoffLimit: 0
    activeDeadlineSeconds: 3600

# The first-run setup of a Production instance (ADR-1512): the one-time setup token that guards the /setup wizard, and an
# opt-in Job that creates the root administrator without a browser. The chart never creates these Secrets; the operator
# does, and removes them once the instance is initialized.
setup:
  token:
    # Secret holding the setup token (Setup:Token), at least 32 characters, under key. The host then guards /setup with it
    # and generates no token of its own. Empty makes the host generate a token and log it once on one replica.
    existingSecret: ""
    # The key of the setup token in existingSecret. Required when existingSecret is set.
    key: token
  # A Job from the host image that runs the 'setup' command, which creates the root administrator once and exits 0 on an
  # instance that is already initialized, so it can run on every release. It needs no setup token.
  job:
    enabled: false
    # Secret holding the root administrator's user name, email and password under the keys below. Required when the Job is
    # enabled.
    existingSecret: ""
    # The key of the root administrator's user name in existingSecret.
    userNameKey: userName
    # The key of the root administrator's email address in existingSecret. The key may be absent from the Secret.
    emailKey: email
    # The key of the root administrator's password in existingSecret.
    passwordKey: password
    backoffLimit: 2
    activeDeadlineSeconds: 300

# TLS between the ingress and the pods (ADR-1504). The pods serve HTTPS only, and the host refuses to start in
# Production without a certificate it can serve. The chart mounts the certificate at /etc/ncode-identity/tls and points
# the probes, the Service and the Ingress at the pods' HTTPS port.
backendTls:
  # A kubernetes.io/tls Secret the operator created, with tls.crt, tls.key and ca.crt. Its certificate names the
  # Service's DNS names: <service>, <service>.<namespace>, <service>.<namespace>.svc and
  # <service>.<namespace>.svc.cluster.local. Empty makes the chart create a cert-manager Certificate.
  existingSecret: ""
  # The name of a Secret in the release namespace that the ingress controller reads: ca.crt verifies the pods'
  # certificate (Traefik rootCAs) and tls.crt and tls.key are the controller's client certificate, which it presents
  # when clientCertificate.required is true (Traefik certificatesSecrets, a Gateway's backend client certificate). Empty
  # makes the chart issue <release>-ingress from the issuer of certManager when a route uses it.
  ingressSecret: ""
  clientCertificate:
    # Whether the pods refuse a request whose connection carries no certificate from the ingress controller, except
    # the liveness and readiness probes. The controller's certificate must have the subject CN=<commonName>.
    required: false
    # The common name of the ingress controller's certificate; the pods accept only the subject CN=<commonName>.
    commonName: ncode-identity-ingress
  # A ConfigMap in the release namespace that holds only ca.crt, the CA that signs the pods' certificate, which the
  # Gateway API mode's BackendTLSPolicy verifies the pods against. trust-manager makes it, or: kubectl create configmap
  # <name> --from-file=ca.crt=<ca.pem>. Empty with caPublisher.enabled names <release>-ca, which the publisher writes.
  caConfigMap: ""
  # An opt-in hook Job that publishes the ca.crt of the chart's private CA to the CA ConfigMap after cert-manager issues
  # it, so a release that uses the private CA needs no manual ConfigMap. It runs 'kubectl apply -k' and never sees the
  # CA's private key.
  caPublisher:
    enabled: false
    # The official kubectl image, pinned by tag and by the digest of its multi-architecture index; the digest wins when
    # set.
    image:
      repository: registry.k8s.io/kubectl
      tag: v1.37.2
      digest: sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
      pullPolicy: IfNotPresent
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  certManager:
    # The issuer of the pods' certificate. An empty name makes the chart create a private CA: a self-signed Issuer, a CA
    # Certificate and a CA Issuer, which signs the pods' certificate. Name an Issuer or ClusterIssuer of your own, such
    # as one backed by your organization's CA, to use it instead.
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    # Hours, because the chart passes them to cert-manager as they are.
    duration: 2160h
    renewBefore: 720h
    privateKey:
      algorithm: ECDSA
      size: 256
    # DNS names beyond the Service's own.
    dnsNames: []

service:
  type: ClusterIP
  port: 443

ingress:
  enabled: false
  # traefik (a ServersTransport and Service annotations) or other (nothing: the operator wires HTTPS to the Service and
  # the trust in the CA). Required when this Ingress or the console's is enabled.
  controller: ""
  className: ""
  annotations: {}
  hosts: []
  #  - host: id.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: id-example-com-tls
  #    hosts:
  #      - id.example.com

# A Gateway API HTTPRoute and a BackendTLSPolicy that verifies the pods against backendTls.caConfigMap.
httpRoute:
  enabled: false
  # The Gateway listeners the route attaches to.
  parentRefs: []
  #  - name: shared-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# The ingress removes a terminating pod from its endpoints asynchronously, so the pod keeps serving for this long
# before the host starts shutting down.
preStopSleepSeconds: 10
# Covers the preStop drain plus the host's 30-second graceful shutdown.
terminationGracePeriodSeconds: 45

probes:
  # The Host header every probe sends, which allowedHosts must accept. Defaults to the first allowed host.
  host: ""
  startup:
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Spread replicas across nodes when the scheduler can.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# The management console, a second Deployment from its own image that serves the console's bundle and its BFF on its own
# host (ADR-1458). Its host's Ingress routes every path to the console, and the console calls the server's management
# API at /api on its authority's origin (ADR-1437).
managementConsole:
  enabled: false
  # More than one replica requires valkey.existingSecret or valkey.parts.existingSecret below.
  replicaCount: 1
  image:
    repository: ghcr.io/ncodegroup/ncode-identity-management-console
    # Defaults to the chart's appVersion.
    tag: ""
    # When set, the image is pulled by digest and the tag is ignored.
    digest: ""
    pullPolicy: IfNotPresent
  # The console's public host name, such as manage.example.com. It is the console's AllowedHosts, its origin
  # https://<host>, and the host its Ingress routes.
  host: ""
  # Bff:Frontends:mgmt:Authority. Defaults to tenantResolution.staticSingle.issuer under StaticSingle. The console calls
  # the management API at /api on its origin.
  authority: ""
  # The console's two key rings: client is Bff:KeyRings:mgmt-client, which signs the client's assertions, and dpop is
  # Bff:KeyRings:mgmt-dpop, which signs its DPoP proofs. Each holds a PEM key from a Secret, keys a key management
  # service holds, or both, and at least one key (ADR-1479, ADR-1485).
  keyRings:
    client:
      # Secret holding the client's private key under the key 'mgmt-client.pem'; the key's id is mgmt-client.
      pemSecret: ""
      # Keys a key management service holds, by key id: provider (aws-kms, azure-key-vault or google-cloud-kms), keyId
      # (an AWS KMS key or alias ARN, a Key Vault key version identifier or a Cloud KMS crypto key version name),
      # algorithm, secretType, keySizeBits and, for an elliptic-curve key, curve.
      remoteKeys: {}
      #  mgmt-client:
      #    provider: aws-kms
      #    keyId: arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
      #    algorithm: ES256
      #    secretType: ecc
      #    keySizeBits: 256
      #    curve: P-256
    dpop:
      # Secret holding the DPoP private key under the key 'mgmt-dpop.pem'; the key's id is mgmt-dpop.
      pemSecret: ""
      # Keys a key management service holds, as for the client key ring. Each DPoP proof is then a call to the service.
      remoteKeys: {}
  # The console's own workload identities, through which it reaches the key management services its remote keys name.
  # Each has the shape of the server's identity of the same vendor under secretProtection and federates the console's
  # service account. The pods carry a vendor's credentials only when a remote key names that vendor.
  secretProtection:
    awsKms:
      webIdentity:
        # IAM role the console's service account assumes through the cluster's IAM OIDC identity provider.
        roleArn: ""
        audience: sts.amazonaws.com
        tokenExpirationSeconds: 3600
    azureKeyVault:
      workloadIdentity:
        # Entra tenant of the identity whose federated credential trusts the console's service account.
        tenantId: ""
        # Client ID of the identity whose federated credential trusts the console's service account.
        clientId: ""
        audience: api://AzureADTokenExchange
        tokenExpirationSeconds: 3600
    googleCloudKms:
      workloadIdentityFederation:
        # Workload identity pool provider:
        # projects/<project number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>.
        provider: ""
        # Service account to impersonate; empty when the key grants its role to the federated principal.
        serviceAccountEmail: ""
        tokenExpirationSeconds: 3600
  # The console's own Valkey, never the server's.
  valkey:
    existingSecret: ""
    connectionStringKey: connection-string
    # An empty key falls back to valkey.parts; ssl is the console's own.
    parts:
      existingSecret: ""
      hostKey: ""
      portKey: ""
      usernameKey: ""
      passwordKey: ""
      ssl: false
  # The console's serving certificate: a kubernetes.io/tls Secret with tls.crt, tls.key and ca.crt, or empty for a
  # cert-manager Certificate from the issuer of backendTls.certManager.
  backendTls:
    existingSecret: ""
    # A Secret in the release namespace that the ingress controller reads to verify the console's pods and, when
    # backendTls.clientCertificate.required is true, to authenticate to them (see backendTls.ingressSecret).
    # Empty uses backendTls.ingressSecret, and then <release>-ingress.
    ingressSecret: ""
    # A ConfigMap in the release namespace that holds only ca.crt, for a Gateway API implementation to verify the
    # console's pods. Empty uses the server's CA ConfigMap, so the chart requires it when existingSecret is set and
    # backendTls.caPublisher is enabled.
    caConfigMap: ""
  service:
    type: ClusterIP
    port: 443
  # Routes every path to the console.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls: []
    #  - secretName: manage-example-com-tls
    #    hosts:
    #      - manage.example.com
  # A Gateway API HTTPRoute and a BackendTLSPolicy for the console. Its hostname is managementConsole.host.
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 45
  probes:
    startup:
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 60
    liveness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Spread replicas across nodes when the scheduler can.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Any other console setting, as environment variables, and extra volumes.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

# Any other host setting, as environment variables (for example Logging__LogLevel__Default), and extra volumes. The
# migration Job receives them too, so a setting the database connection needs (a CA bundle, say) reaches both.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
