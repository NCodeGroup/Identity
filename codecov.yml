# Codecov configuration (ADR-0143). Reports arrive from .github/workflows/codecov-upload.yml, which both CI tiers call:
# .NET under the `dotnet` flag (ci.yml) and the frontend workspace under the `frontend` flag (frontend.yml).

coverage:
  status:
    # Codecov reports; it does not gate. Both statuses are informational, so the only required check stays
    # "Definition of Done". A coverage threshold, if one is ever wanted, is a deliberate policy decision of its own,
    # not a side effect of turning reporting on.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# A pull request into main runs only the tests its change affects (ADR-0263), so its project coverage reflects part of
# the code and only patch coverage is meaningful there. main's full runs still report project coverage.
comment:
  hide_project_coverage: true

# The coverage scope is set where coverage is collected (build/coverage.runsettings), so the job summary and Codecov read
# the same reports (ADR-0185). Codecov scores a partially covered line as a miss by default, while ReportGenerator, which
# writes the job summary, counts it as covered; counting partials as hits keeps the two figures equal.
parsers:
  cobertura:
    partials_as_hits: true

flag_management:
  individual_flags:
    - name: dotnet
    # Frontend CI is path-filtered, so a commit that touches no frontend file uploads no frontend coverage. Carrying the
    # last frontend report forward keeps that tier's numbers on such commits instead of reporting it as uncovered.
    - name: frontend
      paths:
        - src/frontend/
      carryforward: true
